# Objavljivanje na GitHub Pages sa grane main.
# Pages se uključuje jednom, ručno: Settings → Pages → Source: GitHub Actions.
# (Automatsko uključivanje ovde ne radi — token radne mašine ne sme da napravi Pages sajt.)
name: Objavi igre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  objavi:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
