  ["Novi Zeland","🇳🇿","Velington","dolar","Okeanija"],

const IME = 0, ZASTAVA = 1, GRAD = 2, VALUTA = 3, KONTINENT = 4;

const VRSTE = {
  zastava: { nm: "🚩 Zastave", opis: "vidiš zastavu — pogodi koja je država", polje: IME },
  valuta:  { nm: "💰 Valute", opis: "vidiš državu — pogodi čime se tamo plaća", polje: VALUTA },
  grad:    { nm: "🏛 Glavni gradovi", opis: "vidiš državu — pogodi glavni grad", polje: GRAD },
  mesano:  { nm: "🎲 Sve pomešano", opis: "pitanja iz sve tri vrste", polje: null }
};

let rekordi = {}, izbor = { vrsta: "zastava" };
let G = null, zakljucano = false, tajmer = null;

function ucitaj() { try { rekordi = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { rekordi = {}; } }
function upisi() { try { localStorage.setItem(KEY, JSON.stringify(rekordi)); } catch (e) { } }

function promesaj(a) {
  const k = a.slice();
  for (let i = k.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [k[i], k[j]] = [k[j], k[i]]; }
  return k;
}

/* Ponuđeni pogrešni odgovori: prvo sa istog kontinenta (tako je pitanje pravo
   pitanje, a ne pogađanje po izgledu), pa tek onda bilo koji — i nikad isti
   tekst kao tačan odgovor, jer valuta i grad umeju da se ponove. */
function ponude(d, polje) {
  const tacan = d[polje];
  const uzeto = [tacan], out = [];
  const dodaj = spisak => {
    for (const x of spisak) {
      if (out.length >= 2) return;
      if (uzeto.indexOf(x[polje]) >= 0) continue;
      uzeto.push(x[polje]); out.push(x[polje]);
    }
  };
  dodaj(promesaj(DRZAVE.filter(x => x[KONTINENT] === d[KONTINENT] && x !== d)));
  dodaj(promesaj(DRZAVE.filter(x => x[KONTINENT] !== d[KONTINENT])));
  return promesaj(out.concat([tacan]));
}

function vrstaPitanja() {
  if (izbor.vrsta !== "mesano") return izbor.vrsta;
  return ["zastava", "valuta", "grad"][Math.floor(Math.random() * 3)];
}

function novaPartija() {
  const red = promesaj(DRZAVE).slice(0, PITANJA).map(d => {
    const v = vrstaPitanja();
    return { d: d, v: v, ponude: ponude(d, VRSTE[v].polje) };
  });
  G = { red: red, k: 0, tacnih: 0, gotovo: false, poceto: Date.now(), vrsta: izbor.vrsta };
  zakljucano = false;
  hideOverlay();
  crtaj();
}

function pitanje() { return G && G.red[G.k]; }

function crtaj() {
  if (!G) { $("#hud").innerHTML = ""; $("#pitanje").innerHTML = ""; $("#odg").innerHTML = ""; return; }
  const p = pitanje();
  $("#hud").innerHTML =
    '<span class="kut">' + VRSTE[G.vrsta].nm + '</span>' +
    '<span class="kut">Pitanje <b>' + Math.min(G.k + 1, PITANJA) + '</b>/' + PITANJA + '</span>' +
    '<span class="kut">Tačnih <b>' + G.tacnih + '</b></span>';
  if (!p) return;
  if (p.v === "zastava") {
    $("#pitanje").innerHTML = '<div class="zastava">' + p.d[ZASTAVA] + '</div>' +
      '<div class="sta">Koja je ovo država?</div>';
  } else {
    $("#pitanje").innerHTML = '<div class="drzava"><span class="mala">' + p.d[ZASTAVA] + '</span>' +
      p.d[IME] + '</div>' +
      '<div class="sta">' + (p.v === "valuta" ? "Čime se tamo plaća?" : "Koji je glavni grad?") + '</div>';
  }
  $("#odg").innerHTML = p.ponude.map((t, i) =>
    '<button data-i="' + i + '">' + t + '</button>').join("");
  for (const b of document.querySelectorAll("#odg button")) b.onclick = () => odgovor(+b.dataset.i);
  javi("");
}

function javi(t, vrsta) {
  const el = $("#msg");
  el.textContent = t;
  el.className = "msg col" + (vrsta ? " " + vrsta : "");
}

function odgovor(i) {
  if (zakljucano || !G || G.gotovo) return;
  const p = pitanje();
  if (!p) return;
  zakljucano = true;
  const tacan = p.d[VRSTE[p.v].polje];
  const dat = p.ponude[i];
  const dugmad = document.querySelectorAll("#odg button");
  for (const b of dugmad) {
    const t = b.textContent;
    if (t === tacan) b.classList.add("tacno");
    else if (t === dat) b.classList.add("netacno");
    b.disabled = true;
  }
  if (dat === tacan) {
    G.tacnih++;
    window.SFX && SFX.good();
    javi("✓ Tačno", "dobro");
  } else {
    window.SFX && SFX.bad();
    javi("✗ Tačno je: " + tacan, "lose");
  }
  crtajHud();
  tajmer = setTimeout(dalje, dat === tacan ? 700 : 1500);
}
function crtajHud() {
  if (!G) return;
  $("#hud").innerHTML =
    '<span class="kut">' + VRSTE[G.vrsta].nm + '</span>' +
    '<span class="kut">Pitanje <b>' + Math.min(G.k + 1, PITANJA) + '</b>/' + PITANJA + '</span>' +
    '<span class="kut">Tačnih <b>' + G.tacnih + '</b></span>';
}

function dalje() {
  clearTimeout(tajmer); tajmer = null;
  if (!G) return;
  G.k++;
  zakljucano = false;
  if (G.k >= G.red.length) return kraj();
  crtaj();
}

function kraj() {
  G.gotovo = true;
  const sek = Math.round((Date.now() - G.poceto) / 1000);
  const kljuc = "naj." + G.vrsta;
  const bio = rekordi[kljuc] || 0;
  const rekord = G.tacnih > bio;
  if (rekord) { rekordi[kljuc] = G.tacnih; upisi(); }
  window.TOP && window.TOP.upisi("zastave", G.vrsta, G.tacnih, STAT ? STAT.vreme(sek) : sek + " s");
  window.SFX && (G.tacnih >= 8 ? SFX.jackpot() : G.tacnih >= 5 ? SFX.win() : SFX.tick());
  pokaziKraj(sek, rekord);
}

function showOverlay(h) { const o = $("#overlay"); o.innerHTML = h; o.hidden = false; }
function hideOverlay() { $("#overlay").hidden = true; }

function pokaziKraj(sek, rekord) {
  const naj = rekordi["naj." + G.vrsta] || 0;
  showOverlay('<h2>' + (G.tacnih >= 8 ? "🏆 Odlično!" : G.tacnih >= 5 ? "👍 Dobro" : "🙂 Ima još") + '</h2>' +
    '<div class="rez">' +
    '<div><span>Tačnih</span><b>' + G.tacnih + ' / ' + PITANJA + '</b></div>' +
    '<div><span>Vreme</span><b>' + (window.STAT ? STAT.vreme(sek) : sek + " s") + '</b></div>' +
    '<div><span>Najbolje ovde</span><b>' + naj + ' / ' + PITANJA + '</b></div></div>' +
    (rekord ? '<p style="color:var(--gold)">Novi lični rekord u ovoj vrsti!</p>' : '') +
    '<div class="btns"><button id="opetBtn">↻ Još jednom</button>' +
    '<button id="vrstaBtn">🎯 Promeni vrstu</button></div>' +
    '<div class="btns"><button id="meniBtn">☰ Meni</button></div>');
  $("#opetBtn").onclick = novaPartija;
  $("#vrstaBtn").onclick = biraj;
  $("#meniBtn").onclick = meni;
}

function meni() {
  clearTimeout(tajmer); tajmer = null;
  const v = VRSTE[izbor.vrsta];
  const naj = rekordi["naj." + izbor.vrsta] || 0;
  showOverlay('<h2>🚩 Zastave</h2>' +
    '<p>Deset pitanja, tri ponuđena odgovora. Pogađa se država po zastavi, valuta kojom se u njoj plaća ili njen glavni grad. ' +
    'U igri je <b>' + DRZAVE.length + ' država</b>, a pogrešni odgovori se biraju sa istog kontinenta — da pitanje bude pravo pitanje.</p>' +
    '<p>Sada: <b style="color:var(--ink)">' + v.nm + '</b> · najbolje <b style="color:var(--ink)">' + naj + '/' + PITANJA + '</b></p>' +
    '<div class="btns"><button id="igrajBtn">▶ Igraj</button>' +
    '<button id="vrstaBtn2">🎯 Vrsta pitanja</button></div>' +
    '<div class="btns"><button id="pravBtn">❔ Pravila</button></div>');
  $("#igrajBtn").onclick = novaPartija;
  $("#vrstaBtn2").onclick = biraj;
  $("#pravBtn").onclick = () => window.PRAVILA_IGRE && PRAVILA_IGRE.pokazi("zastave");
}

function biraj() {
  let h = '<h2>🎯 Vrsta pitanja</h2><div class="izbor">';
  for (const k of Object.keys(VRSTE)) {
    const v = VRSTE[k], naj = rekordi["naj." + k] || 0;
    h += '<button data-k="' + k + '"' + (izbor.vrsta === k ? ' class="on"' : '') + '>' + v.nm +
      '<small>' + v.opis + ' · najbolje ' + naj + '/' + PITANJA + '</small></button>';
  }
  h += '</div><div class="btns"><button id="nazadBtn">← Nazad</button></div>';
  showOverlay(h);
  for (const b of document.querySelectorAll(".izbor button"))
    b.onclick = () => {
      izbor.vrsta = b.dataset.k;
      rekordi.izbor = izbor; upisi();
      window.SFX && SFX.tap();
      novaPartija();
    };
  $("#nazadBtn").onclick = () => (G && !G.gotovo ? (hideOverlay(), crtaj()) : meni());
}

/* ---------- start ---------- */
try { const t = localStorage.getItem(THEME_KEY); if (t) document.body.dataset.theme = t; } catch (e) { }
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) { }
};
ucitaj();
if (rekordi.izbor && VRSTE[rekordi.izbor.vrsta]) izbor = rekordi.izbor;
crtaj(); meni();

window.Z = {
  DRZAVE, VRSTE, PITANJA, IME, ZASTAVA, GRAD, VALUTA, KONTINENT,
  get G() { return G; }, get izbor() { return izbor; }, get rekordi() { return rekordi; },
  ponude, novaPartija, odgovor, dalje, meni, biraj, crtaj, promesaj
};
</script>
</body>
</html>
