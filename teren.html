<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "teren.v1", THEME_KEY = "sudoku.theme";

/* ---------- tabla ----------
   Tabla je mnogo veća od ekrana: ekran je prozor koji prati igrača, a ceo teren se
   vidi na mapici u uglu. Vlasništvo i tragovi stoje u ravnim nizovima, po ćeliji
   jedan bajt. */
const KOL = 280, RED = 380, POLJA = KOL * RED;
const VID_KOL = 112;                           // koliko ćelija stane preko ekrana
const cv = $("#cv"), ctx = cv.getContext("2d");
let PPC = 10;                                  // pravih piksela po ćeliji
let vidW = VID_KOL, vidH = 50;                 // koliko ćelija se vidi
const kam = { x: 0, y: 0 };                    // gornji levi ugao prozora, u ćelijama

const TEZINE = {
  lako:    { nm: "Lako",    opis: "dva protivnika, ne love",  botovi: 2, brzina: 21,   agro: 0,  domet: 34 },
  srednje: { nm: "Srednje", opis: "tri, gledaju tuđi trag",    botovi: 3, brzina: 24.5, agro: 34, domet: 44 },
  tesko:   { nm: "Teško",   opis: "pet, brzi su i love te",    botovi: 5, brzina: 27,   agro: 52, domet: 56 }
};
const CILJEVI = [20, 30, 40, 50, 60];          // koliko table treba zauzeti za pobedu

/* Skriveni dragulji: vide se tek kad im priđeš, a nose kratku prednost. */
const BONUS = [
  { k: "stit",  em: "🛡", nm: "štit",  opis: "deset sekundi te niko ne može oboriti", boja: "#7fd7ff", traje: 10 },
  { k: "brzo",  em: "⚡", nm: "brzina", opis: "deset sekundi ideš brže",              boja: "#ffd24a", traje: 10 },
  { k: "led",   em: "❄",  nm: "led",    opis: "protivnici uspore na osam sekundi",     boja: "#a6ecff", traje: 8 },
  { k: "teren", em: "💎", nm: "dragulj", opis: "parče terena ti odmah pripadne",       boja: "#b9f27c", traje: 0 }
];
const MAX_BONUSA = 6, VIDI_BONUS = 46, UZMI_BONUS = 3.4;
const BRZINA_JA = 26;                          // ćelija u sekundi
const OKRET = 5.2;                             // radijana u sekundi — koliko brzo glava skreće
const BAZA = 11;                               // poluprečnik početnog terena, u ćelijama
const GLAVA = 2.7, TRAG_SIR = 2.3;             // koliko se crtaju glava i trag
const SUDAR = 2.4;                             // na kojoj razdaljini se glave sudaraju
const STARTNI_MIR = 6;                         // sekundi koliko protivnici ostaju na svom terenu
const PI2 = Math.PI * 2;
const normUg = a => { a %= PI2; if (a > Math.PI) a -= PI2; if (a < -Math.PI) a += PI2; return a; };
const BOJE = [
  { p: "#c9a227", t: "#f5da7a", nm: "ti" },
  { p: "#d65a4e", t: "#f5a79e", nm: "crveni" },
  { p: "#3f8fd6", t: "#a0cbef", nm: "plavi" },
  { p: "#2e9e6b", t: "#8adcb4", nm: "zeleni" },
  { p: "#9a6bd6", t: "#c9aaf0", nm: "ljubičasti" },
  { p: "#d98324", t: "#f3c188", nm: "narandžasti" },
  { p: "#2ba6a6", t: "#8ad9d9", nm: "tirkizni" }
];

const idx = (x, y) => y * KOL + x;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const vlas = new Uint8Array(POLJA);        // 0 = ničije, inače id igrača
const tragV = new Uint8Array(POLJA);       // čiji trag leži na polju
const oznaka = new Uint8Array(POLJA);      // radna, za plavljenje
const stek = new Int32Array(POLJA);

let igraci = [], ja = null, mojIndex = 0;
let stanje = "meni";                       // meni | igra | pauza | kraj | ceka
let tez = "srednje", cilj = 30, vreme = 0, raf = null, lastTs = 0, prljav = true;
let bonusi = [], sledeciBonus = 5;         // dragulji na tabli i vreme do sledećeg
let priprema = 0;                              // kratak predah pre nego što krene
let rekordi = {};                          // po težini: {pr, vreme}

/* ---------- rekordi ---------- */
function ucitaj() { try { rekordi = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { rekordi = {}; } }
function upisi() { try { localStorage.setItem(KEY, JSON.stringify(rekordi)); } catch (e) { } }
function zapamtiRezultat(pr, sek, pobeda) {
  const r = rekordi[tez] || { pr: 0, vremena: {} };
  if (!r.vremena) r.vremena = {};
  if (pr > (r.pr || 0)) r.pr = Math.round(pr);
  if (pobeda && (!r.vremena[cilj] || sek < r.vremena[cilj])) r.vremena[cilj] = Math.round(sek);
  rekordi[tez] = r;
  rekordi.izbor = { tez, cilj };
  upisi();
}
function najboljeVreme(t, c) {
  const r = rekordi[t];
  return (r && r.vremena && r.vremena[c]) || 0;
}
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

/* ---------- nova partija ---------- */
function noviIgrac(i, bot, ime, mrezaId) {
  return {
    id: i + 1, boja: BOJE[i], bot: bot, ime: ime || "", mrezaId: mrezaId || "",
    px: 0, py: 0, ug: -Math.PI / 2, cilj: -Math.PI / 2,      // položaj i pravac — sve u realnim brojevima
    trag: [], putanja: [], dom: null, meta: null, plan: null, dubina: 40,
    ziv: true, ozivi: 0, odmor: 0, stit: 0, brzo: 0, usporen: 0,
    brzina: bot ? TEZINE[tez].brzina : BRZINA_JA,
    bb: { x0: KOL, y0: RED, x1: -1, y1: -1 },               // okvir mog terena, za brže plavljenje
    polja: 0, pr: 0
  };
}
function prosiriBB(e, x, y) {
  const b = e.bb;
  if (x < b.x0) b.x0 = x;
  if (y < b.y0) b.y0 = y;
  if (x > b.x1) b.x1 = x;
  if (y > b.y1) b.y1 = y;
}
const imeIgraca = e => e.ime || (e.bot ? "protivnik (" + e.boja.nm + ")" : "igrač");
const brzinaOd = e => e.brzina * (e.brzo > 0 ? 1.45 : 1) * (e.usporen > 0 ? .6 : 1);
const sudim = () => rezim !== "gost";          // domaćin i igra za jednog sude sami sebi
function bazu(e, x, y) {
  const cx = clamp(Math.round(x), BAZA + 2, KOL - BAZA - 3), cy = clamp(Math.round(y), BAZA + 2, RED - BAZA - 3);
  for (let j = -BAZA; j <= BAZA; j++) for (let i = -BAZA; i <= BAZA; i++) {
    if (i * i + j * j > BAZA * BAZA) continue;               // okrugla baza — nema stepenica
    vlas[idx(cx + i, cy + j)] = e.id;
  }
  e.px = cx + .5; e.py = cy + .5;
  e.ug = e.cilj = cy > RED / 2 ? -Math.PI / 2 : Math.PI / 2;
  e.trag.length = 0; e.putanja.length = 0; e.dom = null; e.meta = null; e.plan = null;
  prosiriBB(e, cx - BAZA, cy - BAZA); prosiriBB(e, cx + BAZA, cy + BAZA);
}
function rasporedi(n, rnd) {                 // svako dobije svoj ugao table, isto na oba telefona
  const a0 = rnd() * Math.PI * 2, out = [];
  for (let i = 0; i < n; i++) {
    const a = a0 + i * 2 * Math.PI / n;
    const r = .62 + rnd() * .28;               // ne svi na istom krugu, ali svako u svom pravcu
    out.push({ x: Math.round(KOL / 2 + Math.cos(a) * (KOL / 2 - 22) * r), y: Math.round(RED / 2 + Math.sin(a) * (RED / 2 - 28) * r) });
  }
  return out;
}
function nova(seme, tezina, ljudi, ciljPr) {
  if (tezina) tez = tezina;
  if (ciljPr) cilj = ciljPr;
  const T = TEZINE[tez];
  const rnd = mulberry32(seme | 0);
  vlas.fill(0); tragV.fill(0);
  igraci = [];
  const ljudiN = ljudi && ljudi.length ? ljudi.length : 1;
  for (let i = 0; i < ljudiN; i++) {
    const l = ljudi ? ljudi[i] : null;
    igraci.push(noviIgrac(i, false, l ? l.ime : "", l ? l.id : ""));
  }
  const botova = Math.max(0, T.botovi - (ljudiN - 1));       // ljudi popunjavaju tablu umesto botova
  for (let i = 0; i < botova && igraci.length < BOJE.length; i++) igraci.push(noviIgrac(igraci.length, true));
  mojIndex = ljudi ? Math.max(0, ljudi.findIndex(l => l.id === (window.Mreza ? Mreza.jaSam() : ""))) : 0;
  ja = igraci[mojIndex];
  const mesta = rasporedi(igraci.length, rnd);
  igraci.forEach((e, i) => bazu(e, mesta[i].x, mesta[i].y));
  bonusi = []; sledeciBonus = 5;
  vreme = 0; prljav = true; stanje = "igra"; lastTs = 0; priprema = 1.4;
  prebroj(); hud(); hideOverlay();
  window.SFX && SFX.whoosh();
}

/* ---------- skriveni dragulji ---------- */
function spustiBonus() {
  /* Dragulj pada u okolinu nekog igrača — dovoljno daleko da se ne dobije badava,
     dovoljno blizu da se na njega naiđe dok se kruži. */
  const zivi = igraci.filter(e => e.ziv);
  for (let pok = 0; pok < 200; pok++) {
    let x, y;
    if (zivi.length && pok < 160) {
      const c = zivi[(Math.random() * zivi.length) | 0];
      const ug = Math.random() * PI2, d = 38 + Math.random() * 46;
      x = Math.round(c.px + Math.cos(ug) * d); y = Math.round(c.py + Math.sin(ug) * d);
    } else {
      x = 3 + ((Math.random() * (KOL - 6)) | 0); y = 3 + ((Math.random() * (RED - 6)) | 0);
    }
    if (x < 2 || y < 2 || x >= KOL - 2 || y >= RED - 2) continue;
    const i = idx(x, y);
    if (vlas[i] || tragV[i]) continue;
    let blizu = false;
    for (const e of igraci) if (e.ziv && Math.abs(e.px - x) + Math.abs(e.py - y) < 30) { blizu = true; break; }
    if (blizu) continue;
    if (bonusi.some(b => Math.abs(b.x - x) + Math.abs(b.y - y) < 34)) continue;
    bonusi.push({ v: (Math.random() * BONUS.length) | 0, x, y });
    return true;
  }
  return false;
}
function uzmiBonus(e, v) {                     // isto se izvršava i kod domaćina i kod gostiju
  const B = BONUS[v];
  if (!B) return;
  if (B.k === "stit") e.stit = B.traje;
  else if (B.k === "brzo") e.brzo = B.traje;
  else if (B.k === "led") { for (const d of igraci) if (d !== e) d.usporen = B.traje; }
  else if (B.k === "teren") {
    const R = 20, gx = Math.round(e.px), gy = Math.round(e.py), cel = [];
    for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
      if (i * i + j * j > R * R) continue;
      const x = gx + i, y = gy + j;
      if (x < 0 || y < 0 || x >= KOL || y >= RED) continue;
      cel.push(idx(x, y));
    }
    zauzmiPolja(e, cel);
  }
  if (e === ja) {
    window.SFX && SFX.jackpot();
    javi(B.em + " " + B.nm + " — " + B.opis);
  } else if (window.SFX) SFX.coin();
  hud();
}
let javnoDo = 0, javnoTekst = "";
function javi(t) { javnoTekst = t; javnoDo = performance.now() + 2600; }

/* ---------- kretanje ----------
   Glava se kreće u bilo kom pravcu, ne po ćelijama: ima svoj položaj u realnim
   brojevima i ugao koji se okreće ograničenom brzinom. Mreža ćelija služi samo
   za teren i za trag — put od kadra do kadra se „prevuče“ preko ćelija, pa se
   po njima sudi. Trag se crta kao glatka linija kroz stvarne tačke puta. */
function okreni(e, dt) {
  const raz = normUg(e.cilj - e.ug);

function napraviObrise() {
  const karte = igraci.map(() => new Map());
  for (let y = 0; y < RED; y++) {
    const red = y * KOL;
    for (let x = 0; x < KOL; x++) {
      const v = vlas[red + x];
      if (!v) continue;
      const m = karte[v - 1];
      if (!m) continue;
      /* smer je takav da je moj teren uvek s iste strane — tako se petlje same sklope */
      if (x === 0 || vlas[red + x - 1] !== v) dodajPoteg(m, x, y + 1, x, y);
      if (x === KOL - 1 || vlas[red + x + 1] !== v) dodajPoteg(m, x + 1, y, x + 1, y + 1);
      if (y === 0 || vlas[red - KOL + x] !== v) dodajPoteg(m, x, y, x + 1, y);
      if (y === RED - 1 || vlas[red + KOL + x] !== v) dodajPoteg(m, x + 1, y + 1, x, y + 1);
    }
  }
  obrisTacke = [];
  obrisi = karte.map(m => {
    const put = new Path2D();
    const petlje = [];
    for (const petlja of petljeIgraca(m)) {
      const izravnata = rdp(bezPravih(petlja), 1.15);
      if (izravnata.length < 8) continue;       // sasvim sitne mrlje se preskaču
      upisiPetlju(put, izravnata);
      petlje.push(izravnata);
    }
    obrisTacke.push(petlje);
    return petlje.length ? put : null;
  });
}
function crtajTeren() {
  for (let i = 0; i < igraci.length; i++) {
    const put = obrisi[i];
    if (!put) continue;
    ctx.fillStyle = igraci[i].boja.p;
    ctx.fill(put, "evenodd");
    ctx.lineWidth = .7;                         // svetla ivica po obodu, da mrlja ima rub
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.stroke(put);
  }
}
function ciljKamere() {
  if (!ja) return { x: 0, y: 0 };
  const cx = ja.px, cy = ja.py;
  return {
    x: clamp(cx - vidW / 2, 0, Math.max(0, KOL - vidW)),
    y: clamp(cy - vidH / 2, 0, Math.max(0, RED - vidH))
  };
}
function pomeriKameru(dt) {
  const c = ciljKamere();
  const k = dt > 0 ? Math.min(1, dt * 14) : 1;          // meko praćenje, bez trzanja
  kam.x += (c.x - kam.x) * k;
  kam.y += (c.y - kam.y) * k;
}
function mapa() {                              // cela tabla u uglu, sa prozorom i glavama
  const sirina = Math.round(Math.min(cv.width * .27, cv.height * .27 * KOL / RED));
  const visina = Math.round(sirina * RED / KOL);
  const pad = Math.round(PPC * .7);
  const mx = cv.width - sirina - pad, my = pad;
  ctx.save();
  ctx.fillStyle = "rgba(4,7,13,.82)";
  ctx.fillRect(mx - 3, my - 3, sirina + 6, visina + 6);
  ctx.fillStyle = "#0a1120";
  ctx.fillRect(mx, my, sirina, visina);
  ctx.save();                                  // ista glatka slika, samo umanjena
  ctx.translate(mx, my);
  ctx.scale(sirina / KOL, visina / RED);
  for (let i = 0; i < igraci.length; i++) {
    const put = obrisi[i];
    if (!put) continue;
    ctx.fillStyle = igraci[i].boja.p;
    ctx.fill(put, "evenodd");
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(238,242,249,.45)"; ctx.lineWidth = 1;
  ctx.strokeRect(mx - 2.5, my - 2.5, sirina + 5, visina + 5);
  const sx = sirina / KOL, sy = visina / RED;
  ctx.strokeStyle = "rgba(255,255,255,.8)";              // gde je prozor na tabli
  ctx.strokeRect(mx + kam.x * sx, my + kam.y * sy, vidW * sx, vidH * sy);
  for (const e of igraci) {                              // glave, da se vidi ko je gde
    if (!e.ziv) continue;
    ctx.fillStyle = e.boja.p;
    ctx.beginPath(); ctx.arc(mx + e.px * sx, my + e.py * sy, e === ja ? 2.8 : 2.1, 0, 7); ctx.fill();
    if (e === ja) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2; ctx.stroke(); }
  }
  ctx.restore();
}
function crtaj() {
  if (prljav) { napraviObrise(); prljav = false; }
  const ox = Math.round(clamp(kam.x, 0, Math.max(0, KOL - vidW)) * PPC);
  const oy = Math.round(clamp(kam.y, 0, Math.max(0, RED - vidH)) * PPC);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#06090f";                   // van table
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(PPC, 0, 0, PPC, -ox, -oy);  // dalje se crta u ćelijama

  const x0 = Math.max(0, Math.floor(ox / PPC)), y0 = Math.max(0, Math.floor(oy / PPC));
  const x1 = Math.min(KOL, Math.ceil((ox + cv.width) / PPC) + 1);
  const y1 = Math.min(RED, Math.ceil((oy + cv.height) / PPC) + 1);

  ctx.fillStyle = "#0a1120";                   // sama tabla
  ctx.fillRect(0, 0, KOL, RED);
  ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 1 / PPC;
  ctx.beginPath();
  for (let x = Math.ceil(x0 / 20) * 20; x < x1; x += 20) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = Math.ceil(y0 / 20) * 20; y < y1; y += 20) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();

  crtajTeren();

  const opasno = ja && ja.ziv && ja.trag.length ? blizuMomTragu() : false;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  for (const e of igraci) {                    // trag ide kroz stvarne tačke puta — bez stepenica
    if (!e.ziv || e.putanja.length < 4) continue;
    ctx.globalAlpha = .95;
    ctx.strokeStyle = (e === ja && opasno)
      ? (Math.floor(performance.now() / 160) % 2 ? "#ff7b6c" : e.boja.t)   // trepće kad neko juri tvoj trag
      : e.boja.t;
    ctx.lineWidth = TRAG_SIR;
    ctx.beginPath();
    ctx.moveTo(e.putanja[0], e.putanja[1]);
    for (let k = 2; k < e.putanja.length; k += 2) ctx.lineTo(e.putanja[k], e.putanja[k + 1]);
    ctx.lineTo(e.px, e.py);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = "rgba(159,176,204,.5)"; ctx.lineWidth = .3;
  ctx.strokeRect(-.15, -.15, KOL + .3, RED + .3);        // ivica table

  if (ja) for (const b of bonusi) {                      // dragulji se vide tek kad im priđeš
    const d = Math.abs(b.x - ja.px) + Math.abs(b.y - ja.py);
    if (d > VIDI_BONUS) continue;
    const B = BONUS[b.v];
    const puls = .85 + .15 * Math.sin(performance.now() / 260);
    ctx.globalAlpha = d > VIDI_BONUS - 10 ? .45 : 1;
    ctx.beginPath(); ctx.arc(b.x + .5, b.y + .5, 6.5 * puls, 0, 7);
    ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x + .5, b.y + .5, 3.6, 0, 7);
    ctx.fillStyle = B.boja; ctx.fill();
    ctx.lineWidth = .6; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.stroke();
    ctx.fillStyle = "rgba(10,17,32,.92)";
    ctx.font = "4.4px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(B.em, b.x + .5, b.y + .9);
    ctx.globalAlpha = 1;
  }
  for (const e of igraci) {
    if (!e.ziv) continue;
    const px = e.px, py = e.py;
    if (px < x0 - 4 || px > x1 + 4 || py < y0 - 4 || py > y1 + 4) continue;
    if (e === ja) {
      ctx.beginPath(); ctx.arc(px, py, GLAVA * 1.7, 0, 7);
      ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(px, py, GLAVA, 0, 7);
    ctx.fillStyle = e.boja.p; ctx.fill();
    ctx.lineWidth = .5; ctx.strokeStyle = e === ja ? "#ffffff" : "rgba(255,255,255,.65)"; ctx.stroke();
    ctx.beginPath(); ctx.arc(px + Math.cos(e.ug) * GLAVA * .5, py + Math.sin(e.ug) * GLAVA * .5, GLAVA * .3, 0, 7);
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fill();
    if (e.stit > 0) {                                    // štit — prsten oko glave
      ctx.beginPath(); ctx.arc(px, py, GLAVA * 1.7 + .35 * Math.sin(performance.now() / 120), 0, 7);
      ctx.lineWidth = .8; ctx.strokeStyle = "#7fd7ff"; ctx.stroke();
    }
    if (e.brzo > 0) {
      ctx.fillStyle = "#ffd24a"; ctx.font = "4.4px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⚡", px - Math.cos(e.ug) * 4.6, py - Math.sin(e.ug) * 4.6);
    }
    if (!e.bot && rezim !== "sam" && e !== ja) {          // u sobi se vidi ko je ko
      ctx.fillStyle = "rgba(238,242,249,.85)";
      ctx.font = "4.4px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(String(imeIgraca(e)).slice(0, 10), px, py - GLAVA * 1.9);
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  mapa();
  if (javnoTekst && performance.now() < javnoDo) {       // kratka poruka o dragulju ili udarcu
    const slovo = Math.max(13, Math.round(cv.width / 32));
    ctx.font = slovo + "px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const w = Math.min(cv.width - 20, ctx.measureText(javnoTekst).width + slovo * 1.6), h = slovo * 2.1;
    const x = cv.width / 2, y = cv.height - h * 1.2;
    ctx.fillStyle = "rgba(8,14,26,.86)";
    ctx.fillRect(x - w / 2, y - h / 2, w, h);
    ctx.strokeStyle = "rgba(201,162,39,.8)"; ctx.lineWidth = 1;
    ctx.strokeRect(x - w / 2, y - h / 2, w, h);
    ctx.fillStyle = "#eef2f9";
    ctx.fillText(javnoTekst, x, y);
  }
  if (priprema > 0 && stanje === "igra") {
    ctx.fillStyle = "rgba(238,242,249,.92)";
    const veliko = Math.max(20, Math.round(cv.width / 17));
    ctx.font = "bold " + veliko + "px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(priprema > .5 ? "Spremi se…" : "Kreni!", cv.width / 2, cv.height / 2);
    ctx.font = Math.round(veliko / 2) + "px system-ui, sans-serif";
    ctx.fillStyle = "rgba(159,176,204,.95)";
    ctx.fillText("cilj: " + cilj + "% cele table", cv.width / 2, cv.height / 2 + veliko);
  }
}

let bioOpasno = false;
function blizuMomTragu() {                     // je li neko blizu mog traga
  for (const e of igraci) {
    if (e === ja || !e.ziv) continue;
    for (let k = 0; k < ja.trag.length; k += 3) {
      const i = ja.trag[k], x = i % KOL, y = (i / KOL) | 0;
      if (Math.abs(e.px - x) + Math.abs(e.py - y) <= 22) {
        if (!bioOpasno) { bioOpasno = true; window.SFX && SFX.tick(); }
        return true;
      }
    }
  }
  bioOpasno = false;
  return false;
}

/* ---------- igra u sobi (do četiri igrača) ----------
   Domaćin vodi partiju: on jedini sudi (ko koga preseca, ko šta zauzima, gde padaju
   dragulji) i desetak puta u sekundi šalje kratak snimak — gde je čija glava. Gosti
   crtaju taj snimak, a svoju glavu vode i sami, da tipke rade odmah bez čekanja na
   mrežu; kad domaćin javi zauzimanje, smrt ili dragulj, to važi. */

let postava = null;                            // [{id, ime}] — ko igra kojom bojom
let cekaonica = false, ponoviVezu = null, tajmerStanja = null;
let sobaTez = "srednje", sobaCilj = 30;

function sobaSalji(m) { if (rezim === "domacin" && window.Mreza) Mreza.posalji(m); }
function ocistiTrag(e) {
  for (const i of e.trag) if (tragV[i] === e.id) tragV[i] = 0;
  e.trag.length = 0; e.dom = null; e.meta = null;
}
function imeMesta(i) {
  const e = igraci[i];
  return e ? imeIgraca(e) : "igrač";
}

function sobaMeni() {

  showOverlay('<h2>🌐 Igra u sobi</h2>' +
