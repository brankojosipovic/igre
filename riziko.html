<style>

  @media (max-height: 600px) { header h1 { font-size: 15px; } .wrap { gap: 5px; } }

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "riziko.v1", THEME_KEY = "sudoku.theme";
const cv = $("#cv"), ctx = cv.getContext("2d");

/* ---------- karta ----------
   Granice dolaze iz svet.js (isti fajl koji koristi igra Mapa), a riziko.js
   kaže koje se države slažu u jednu oblast, ko je s kim u komšiluku i gde se
   piše broj vojske. */
function dekodiraj(s, z) {
  const t = [];
  let i = 0, x = 0, y = 0;
  while (i < s.length) {
    let r = 0, sh = 0, b;
    do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
    x += (r & 1) ? ~(r >> 1) : (r >> 1);
    r = 0; sh = 0;
    do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
    y += (r & 1) ? ~(r >> 1) : (r >> 1);
    t.push(x / z, y / z);
  }
  return t;
}
const BEZ = (window.RIZIKO && RIZIKO.b) || {};
const PRSTENI = {};
for (const d of (window.SVET ? SVET.d : [])) {
  const izbaci = BEZ[d.n] || [];
  PRSTENI[d.n] = d.o.map(o => dekodiraj(o, SVET.z)).filter((p, i) => izbaci.indexOf(i) < 0);
}
const KONT = (window.RIZIKO ? RIZIKO.k : []);
const OBLASTI = (window.RIZIKO ? RIZIKO.o : []).map((o, i) => ({
  i, ime: o.n, kont: o.k, drzave: o.d, lon: o.x, lat: o.y, susedi: o.s,
  prsteni: [].concat(...o.d.map(n => PRSTENI[n] || []))
}));
const MORSKE = (window.RIZIKO ? RIZIKO.m : []);
const N = OBLASTI.length;

/* ---------- projekcija ---------- */
const RAD = Math.PI / 180;
function uSvet(lon, lat) {
  const y = Math.max(-85, Math.min(85, lat));
  const s = Math.sin(y * RAD);
  return { x: (lon + 180) / 360, y: .5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI) };
}
const POJAS = { gore: uSvet(0, 84).y, dole: uSvet(0, -58).y };
const SREDINA = (POJAS.gore + POJAS.dole) / 2;
for (const o of OBLASTI) { const t = uSvet(o.lon, o.lat); o.wx = t.x; o.wy = t.y; }

/* ---------- stanje ---------- */
const BOJE = ["#c9a227", "#d65a4e", "#3f8fd6", "#2e9e6b"];
const SVETLE = ["#f0d98a", "#f3a79e", "#a5cdee", "#8ed7b4"];
const NICIJA = "#25406b";
const CILJEVI = [50, 70, 100];
const POCETNE = { 2: 35, 3: 32, 4: 30 };

let G = null;              // partija
let mod = "racunar";       // racunar | telefon | soba
let izbor = { igraca: 3, mod: "racunar", cilj: 70 };
let soba = null;
const kam = { x: .5, y: SREDINA, z: 1 };
let ciljKam = null, raf = null, lastTs = 0, otkucaj = 0;
let znacke = [];           // položaji brojeva na ekranu, razmaknuti da se ne poklapaju
let PIX = 1;               // koliko ekranskih tačaka ide na jednu CSS tačku
let racunarRadi = false;

function prazno() { return { vlasnik: new Array(N).fill(-1), vojska: new Array(N).fill(0) }; }

/* ---------- pomoćno ---------- */
function mojih(i, st) { const v = (st || G).vlasnik; let n = 0; for (let k = 0; k < N; k++) if (v[k] === i) n++; return n; }
function procenat(i) { return Math.round(mojih(i) * 100 / N); }
function ziv(i) { return mojih(i) > 0; }
function kontinentIgraca(i, k) { for (let o = 0; o < N; o++) if (OBLASTI[o].kont === k && G.vlasnik[o] !== i) return false; return true; }
function bonusi(i) {
  let b = 0;
  for (let k = 0; k < KONT.length; k++) if (kontinentIgraca(i, k)) b += KONT[k].b;
  return b;
}
function pojacanja(i) { return Math.max(3, Math.floor(mojih(i) / 3)) + bonusi(i); }
function granicna(o) {                        // oblast koja gleda u protivnika
  for (const s of OBLASTI[o].susedi) if (G.vlasnik[s] !== G.vlasnik[o]) return true;
  return false;
}
function pritisak(o) {                        // koliko protivničke vojske gleda u nas
  let p = 0;
  for (const s of OBLASTI[o].susedi) if (G.vlasnik[s] !== G.vlasnik[o]) p += G.vojska[s];
  return p;
}
function povezane(o) {                        // sve svoje oblasti dokle se stigne preko svojih
  const moj = G.vlasnik[o], vid = new Set([o]), red = [o];
  while (red.length) {
    const t = red.pop();
    for (const s of OBLASTI[t].susedi) if (G.vlasnik[s] === moj && !vid.has(s)) { vid.add(s); red.push(s); }
  }
  vid.delete(o);
  return vid;
}
const imeIgraca = i => (G.igraci[i] && G.igraci[i].ime) || ("Igrač " + (i + 1));

/* ---------- nova partija ---------- */
function podeli(brojIgraca) {
  const st = prazno();
  const red = [];
  for (let i = 0; i < N; i++) red.push(i);
  for (let i = red.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = red[i]; red[i] = red[j]; red[j] = t; }
  red.forEach((o, k) => { st.vlasnik[o] = k % brojIgraca; st.vojska[o] = 1; });
  const ukupno = POCETNE[brojIgraca] || 30;
  for (let i = 0; i < brojIgraca; i++) {
    const moje = red.filter(o => st.vlasnik[o] === i);
    let ostalo = Math.max(0, ukupno - moje.length);
    while (ostalo-- > 0) st.vojska[moje[(Math.random() * moje.length) | 0]]++;
  }
  return st;
}
function novaPartija(igraci, cilj, pocetno) {
  const st = pocetno || podeli(igraci.length);
  G = {
    igraci, cilj, vlasnik: st.vlasnik, vojska: st.vojska,
    naRedu: 0, faza: "pojacanja", ostalo: 0, izabrana: null, meta: null,
    osvojio: false, prebacio: false, gotovo: false, poredak: [],
    poruka: "", bitka: null, potez: 1
  };
  G.ostalo = pojacanja(0);
  hideOverlay();
  naSvet(true);
  osvezi();
  upisiTok();
  najavaPoteza();
}
function najavaPoteza() {
  const i = G.naRedu;
  poruka(imeIgraca(i) + " — pojačanja", "rasporedi " + G.ostalo + " vojske po svojim oblastima");
  const moje = [];
  for (let o = 0; o < N; o++) if (G.vlasnik[o] === i) moje.push(o);
  if (moje.length) naOblasti(moje);
  osvezi();
  if (!naPotezuCovek() && vodim()) zakaziRacunar(700);
}

/* ---------- ko je na potezu ---------- */
function mojaStolica() {
  if (mod === "soba") return soba ? soba.moj : 0;
  if (mod === "telefon") return G ? G.naRedu : 0;
  return 0;
}
function naPotezuCovek() { return !!G && G.igraci[G.naRedu].tip === "covek"; }
function mogu() {                             // sme li ovaj telefon da dira tablu
  if (!G || G.gotovo) return false;
  if (!naPotezuCovek()) return false;
  return G.naRedu === mojaStolica();
}
function vodim() { return mod !== "soba" || (soba && soba.uloga === "domacin"); }

/* ---------- potezi ---------- */
function stavi(o, koliko) {
  if (!G || G.faza !== "pojacanja" || G.vlasnik[o] !== G.naRedu) return false;
  const n = Math.min(koliko || 1, G.ostalo);
  if (n <= 0) return false;
  G.vojska[o] += n; G.ostalo -= n;
  window.SFX && SFX.tick();
  if (G.ostalo === 0) { G.faza = "napad"; poruka(imeIgraca(G.naRedu) + " — napad", "izaberi svoju oblast pa protivničku"); }
  else poruka(imeIgraca(G.naRedu) + " — pojačanja", "još " + G.ostalo);
  posle();
  return true;
}
function rasporediSve() {                     // brzo: sve preostalo ide tamo gde gori
  if (!G || G.faza !== "pojacanja") return;
  const i = G.naRedu;
  const moje = [];
  for (let o = 0; o < N; o++) if (G.vlasnik[o] === i) moje.push(o);
  const front = moje.filter(granicna);
  const cilj = front.length ? front : moje;
  while (G.ostalo > 0) {
    let naj = cilj[0], najO = -Infinity;
    for (const o of cilj) {
      const oc = pritisak(o) - G.vojska[o] * 1.15 + Math.random();
      if (oc > najO) { najO = oc; naj = o; }
    }
    G.vojska[naj]++; G.ostalo--;
  }
  G.faza = "napad";
  poruka(imeIgraca(i) + " — napad", "izaberi svoju oblast pa protivničku");
  window.SFX && SFX.tap();
  posle();
}
function kocke(n) {
  const k = [];
  for (let i = 0; i < n; i++) k.push(1 + ((Math.random() * 6) | 0));
  return k.sort((a, b) => b - a);
}
function jedanNapad(od, ka) {
  const a = Math.min(3, G.vojska[od] - 1), d = Math.min(2, G.vojska[ka]);
  if (a < 1 || d < 1) return null;
  const na = kocke(a), nb = kocke(d);
  let gubA = 0, gubD = 0;
  for (let i = 0; i < Math.min(a, d); i++) { if (na[i] > nb[i]) gubD++; else gubA++; }
  G.vojska[od] -= gubA; G.vojska[ka] -= gubD;
  return { od, ka, nap: na, odb: nb, gubA, gubD, pao: G.vojska[ka] <= 0 };
}
function napad(od, ka, blic) {
  if (!G || G.faza !== "napad") return false;
  if (G.vlasnik[od] !== G.naRedu || G.vlasnik[ka] === G.naRedu) return false;
  if (OBLASTI[od].susedi.indexOf(ka) < 0 || G.vojska[od] < 2) return false;
  let b = null, krug = 0;
  do {
    const r = jedanNapad(od, ka);
    if (!r) break;
    b = b ? { od, ka, nap: r.nap, odb: r.odb, gubA: b.gubA + r.gubA, gubD: b.gubD + r.gubD, pao: r.pao } : r;
  } while (blic && !b.pao && G.vojska[od] >= 2 && ++krug < 200);
  G.bitka = b;
  if (!b) return false;
  if (b.pao) osvoji(od, ka);
  else {
    window.SFX && (b.gubD > b.gubA ? SFX.good() : SFX.bad());
    poruka(OBLASTI[od].ime + " ⚔ " + OBLASTI[ka].ime,
      "gubici: ti −" + b.gubA + ", protivnik −" + b.gubD);
  }
  posle();
  return true;
}
function osvoji(od, ka) {
  const stari = G.vlasnik[ka];
  const seli = Math.max(1, G.vojska[od] - 1);
  G.vlasnik[ka] = G.naRedu;
  G.vojska[ka] = seli;
  G.vojska[od] -= seli;
  G.osvojio = true;
  G.izabrana = od; G.meta = null;
  window.SFX && SFX.win();
  poruka("🏴 " + OBLASTI[ka].ime + " je pao!", imeIgraca(G.naRedu) + " ulazi sa " + seli + " vojske");
  if (stari >= 0 && !ziv(stari)) {
    G.poredak.unshift(stari);
    poruka("💀 " + imeIgraca(stari) + " je ispao", imeIgraca(G.naRedu) + " uzeo poslednju oblast");

/* ---------- igra u sobi ----------

  G.izabrana = staraIzabrana !== null && G.vlasnik[staraIzabrana] === G.naRedu ? staraIzabrana : null;

function imeIz(id) {

function pokaziKod(kod) {
  const jeDomacin = soba && soba.uloga === "domacin";
  const svi = (Mreza.drustvo() || []).slice(0, 4);
  const stolica = Math.min(4, Math.max(svi.length, izbor.igraca));
  const red = svi.map((x, i) =>
    '<div class="mesto"><i style="background:' + BOJE[i % BOJE.length] + '"></i>' +
    (x.ime || (x.ja ? "ti (bez imena)" : "igrač bez imena")) + (x.ja ? ' <small>— ti</small>' : '') + '</div>').join("") +
    Array.from({ length: Math.max(0, stolica - svi.length) }, (v, k) =>
      '<div class="mesto"><i style="background:' + BOJE[(svi.length + k) % BOJE.length] + '"></i>🤖 Računar</div>').join("");
  showOverlay('<h2>Kod sobe</h2>' +
    '<div class="kodBox" style="font-size:30px;font-weight:700;letter-spacing:8px;color:#c9a227;background:#16223a;' +
    'border:1px solid #283a5e;border-radius:12px;padding:10px 16px">' + kod + '</div>' +
    '<div class="mesta">' + red + (stolica < 4 ? '<div class="mesto prazno">+ ima mesta do četiri igrača</div>' : '') + '</div>' +
    (jeDomacin ? '<p>Cilj: ' + (izbor.cilj >= 100 ? "ceo svet" : izbor.cilj + "% karte") + ' · ' + stolica + ' stolica</p>'
      : '<p>Čekamo da domaćin krene…</p>') +
    '<div class="btns">' +
    (jeDomacin ? '<button id="ciljSoba">🎯 Cilj</button><button id="stolSoba">🎨 Stolice</button>' : '') +
    (jeDomacin && svi.length >= 2 ? '<button id="kreniBtn">▶ Kreni (' + stolica + ')</button>' : '') +
    '<button id="odustBtn">Odustani</button></div>' +
    ((window.IGRAC && !IGRAC.ime()) ? '<p><button id="imeBtn2">👤 Upiši svoje ime</button></p>' : ''));
  const kb = $("#kreniBtn"); if (kb) kb.onclick = kreniUSobi;
  const cb = $("#ciljSoba"); if (cb) cb.onclick = () => {
    izbor.cilj = CILJEVI[(CILJEVI.indexOf(izbor.cilj) + 1) % CILJEVI.length];
    rekordi.izbor = izbor; upisi(); pokaziKod(kod);
  };
  const sb = $("#stolSoba"); if (sb) sb.onclick = () => {
    izbor.igraca = izbor.igraca >= 4 ? 2 : izbor.igraca + 1;
    rekordi.izbor = izbor; upisi(); pokaziKod(kod);
  };
  const ib = $("#imeBtn2"); if (ib) ib.onclick = () => IGRAC.pitaj(() => pokaziKod(kod));
  $("#odustBtn").onclick = () => { sobaKraj(); meni(); };
}
function kreniUSobi() {
  const svi = (Mreza.drustvo() || []).slice(0, 4).map((x, i) => ({ id: x.id, ime: x.ime || ("Igrač " + (i + 1)) }));
  if (svi.length < 2) return;
  const stolica = Math.min(4, Math.max(svi.length, izbor.igraca));
  const igraci = [];
  for (let i = 0; i < stolica; i++)
    igraci.push(i < svi.length ? { ime: svi[i].ime, tip: "covek" } : { ime: "Računar " + i, tip: "racunar" });
  const postava = igraci.map((p, i) => ({ id: i < svi.length ? svi[i].id : "", ime: p.ime }));
  const st = podeli(stolica);
  Mreza.posalji({ t: "P", ig: igraci, po: postava, c: izbor.cilj, v: st.vlasnik, a: st.vojska });
  pocniUSobi(igraci, postava, izbor.cilj, st);
}
function pocniUSobi(igraci, postava, cilj, st) {
  mod = "soba";
  soba.postava = postava;
  soba.moj = Math.max(0, postava.findIndex(x => x.id === Mreza.jaSam()));
  cekaonica = false;
  novaPartija(igraci, cilj, st);
  if (soba.uloga === "domacin") soba.posalji();
}
/* Promenilo se društvo usred partije. Domaćin ponovo pošalje ko gde sedi i
   kartu kakva jeste sada (ne početno deljenje), pa se vraćeni igrač nađe na
   svojoj boji. Ko se vrati sa novom mrežnom oznakom, preuzima svoje prazno
   mesto — inače bi ga dočekala poruka da je soba puna. */
function osveziPostavu() {
  if (!soba || soba.uloga !== "domacin" || !soba.postava || !G || mod !== "soba") return false;
  const drustvo = Mreza.drustvo() || [];
  const sada = drustvo.map(x => x.id);
  const prazna = soba.postava.filter(p => p.id && sada.indexOf(p.id) < 0);
  const strani = sada.filter(id => !soba.postava.some(p => p.id === id));
  while (prazna.length && strani.length) {
    const mesto = prazna.shift(), novi = strani.shift();
    const k = soba.postava.indexOf(mesto);
    const d = drustvo.find(x => x.id === novi);
    soba.postava[k] = { id: novi, ime: (d && d.ime) || mesto.ime };
    if (G.igraci[k]) G.igraci[k].ime = soba.postava[k].ime;
  }
  Mreza.posalji({ t: "P", ig: G.igraci, po: soba.postava, c: G.cilj,
    v: G.vlasnik, a: G.vojska });
  soba.posalji();
  return true;
}
function sobaPrimi(m, od) {
  if (window.CET && CET.primi(m, od)) return;
  if (!soba || !m || !m.t) return;
  if (m.t === "P") {
    if (!m.po.some(x => x.id === Mreza.jaSam())) {
      showOverlay('<h2>Soba je puna</h2><p>Partija je počela bez mesta za tebe.</p><button id="punaBtn">← Meni</button>');
      $("#punaBtn").onclick = () => { sobaKraj(); meni(); };
      return;
    }
    if (sedim() && m.po.length === soba.postava.length) {   // samo osvežena postava
      soba.postava = m.po;
      soba.moj = Math.max(0, m.po.findIndex(x => x.id === Mreza.jaSam()));
      m.po.forEach((x, i) => { if (G.igraci[i] && x.ime) G.igraci[i].ime = x.ime; });
      cekaonica = false; hideOverlay(); osvezi();
      return;
    }
    return pocniUSobi(m.ig, m.po, m.c, { vlasnik: m.v, vojska: m.a });
  }
  if (m.t === "S") { if (soba.uloga === "gost") primiStanje(m.g); return; }
  if (m.t === "A") { if (soba.uloga === "domacin") primiAkciju(m.a, od); return; }
}

/* ---------- petlja i veličina ---------- */
function loop(ts) {
  raf = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(.05, (ts - lastTs) / 1000); lastTs = ts;
  otkucaj += dt;
  pomeriKameru(dt);
  crtaj();
}
function fit() {
  const wrap = document.querySelector(".wrap"), nav = document.querySelector(".gamenav"), stage = document.querySelector(".stage");
  const limit = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  const kids = [...wrap.children].filter(el => el.offsetParent !== null);
  const others = kids.filter(el => el !== stage).reduce((a, el) => a + el.getBoundingClientRect().height, 0);
  const cs = getComputedStyle(wrap);
  const gaps = (parseFloat(cs.rowGap) || 0) * Math.max(0, kids.length - 1);
  const availH = limit - wrap.getBoundingClientRect().top - others - gaps - (parseFloat(cs.paddingBottom) || 0) - 12;
  const availW = Math.min(window.innerWidth - 20, 560 * SIRENJE());
  const w = Math.max(150, Math.floor(availW));
  const h = Math.max(220, Math.floor(Math.min(availH, w * 1.16)));
  const staraZ = kam.z / Math.max(1, granicaZuma());
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  PIX = cv.width / w;
  kam.z = granicaZuma() * (isFinite(staraZ) && staraZ > 0 ? staraZ : 1);
  ogranici();
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 150));
window.addEventListener("load", fit);

/* ---------- start ---------- */
try { const t = localStorage.getItem(THEME_KEY); if (t) document.body.dataset.theme = t; } catch (e) { }
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) { }
};
$("#zumPlus").onclick = () => { const r = cv.getBoundingClientRect(); zumiraj(kam.z * 1.8, r.left + r.width / 2, r.top + r.height / 2); };
$("#zumMinus").onclick = () => { const r = cv.getBoundingClientRect(); zumiraj(kam.z / 1.8, r.left + r.width / 2, r.top + r.height / 2); };
$("#zumSve").onclick = () => naSvet(false);
cv.addEventListener("wheel", e => { e.preventDefault(); zumiraj(kam.z * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });

ucitaj();
if (rekordi.izbor) izbor = Object.assign(izbor, rekordi.izbor);
mod = izbor.mod;
fit(); naSvet(true); osvezi(); crtaj(); meni();
raf = requestAnimationFrame(loop);

window.R = {
  OBLASTI, KONT, MORSKE, BOJE, CILJEVI, N,
  get G() { return G; }, set G(v) { G = v; },
  get mod() { return mod; }, set mod(v) { mod = v; },
  get izbor() { return izbor; }, get soba() { return soba; }, get kam() { return kam; },
  get znacke() { return znacke; },
  podeli, novaPartija, pocni, stavi, rasporediSve, napad, prebaci, uFazu, zavrsiPotez,
  pojacanja, bonusi, mojih, procenat, ziv, povezane, granicna, kontinentIgraca,
  najboljiNapad, najboljePrebacivanje, korakRacunara, izaberi, oblastNa,
  meni, kraj, crtaj, fit, naSvet, zumiraj, granicaZuma, sazmi, primiStanje, primiAkciju,
  ucitajTok, obrisiPartiju, sobaMeni, sobaKraj, kreniUSobi, meniSobe, pokaziSobu, osveziPostavu, uSobi, sedim,
  bezZastoja: () => { clearTimeout(tajmerR); racunarRadi = false; },
  odigrajSve: (maks) => {                      // za probe: pusti da se partija odigra do kraja
    let k = 0;
    while (G && !G.gotovo && k++ < (maks || 4000)) {
      clearTimeout(tajmerR); racunarRadi = false;
      if (naPotezuCovek()) { if (G.faza === "pojacanja") rasporediSve(); else if (G.faza === "napad") { const n = najboljiNapad(G.naRedu); if (n) napad(n.od, n.ka, true); else uFazu("prebacivanje"); } else zavrsiPotez(); }
      else korakRacunara();
    }
    return k;
  }
};
