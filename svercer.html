<style>
  :root {
    color-scheme: dark;
    --bg: #0e1626; --panel: #16223a; --panel-2: #1b2a4a;
    --ink: #eef2f9; --ink-dim: #9fb0cc; --line: #283a5e;
    --gold: #c9a227; --good: #2e9e6b; --bad: #d65a4e;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f2f4f8; --panel: #ffffff; --panel-2: #eef1f7;
    --ink: #1b2a4a; --ink-dim: #5a6884; --line: #d7dded;
    --gold: #a9851a; --good: #1f7d52; --bad: #c0473c;
    --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Calibri, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;                  /* prstima sme da se zumira, ali bez dvostrukog tapa */
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  button { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer;
    touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  @media (hover: hover) { button:hover { border-color: var(--gold); } }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px;
          min-height: 100dvh; padding: 8px 10px 12px; }
  .col { width: min(100vw - 20px, calc(440px * var(--sirenje, 1))); }
  header { display: flex; align-items: center; gap: 10px;
           border-left: 4px solid var(--gold); padding: 4px 0 4px 10px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  header .sub { color: var(--ink-dim); font-size: 13px; }
  .spacer { flex: 1; }

  .bar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-dim); }
  .bar b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar .mode { color: var(--gold); font-weight: 700; font-size: 12px; }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
           padding: 16px; box-shadow: var(--shadow); min-height: 320px;
           display: flex; flex-direction: column; gap: 10px; }
  .stage h2 { margin: 0; font-size: 17px; }
  .stage .dim { color: var(--ink-dim); font-size: 13px; }
  .stage .big { font-size: 40px; text-align: center; line-height: 1.1; }

  .goods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .goods button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 2px;
                  background: var(--panel-2); }
  .goods .em { font-size: 22px; line-height: 1.15; }
  .goods .nm { font-size: 10px; color: var(--ink-dim); }
  .goods .vr { font-size: 10px; font-variant-numeric: tabular-nums; }
  .goods .vr .v { color: var(--good); font-weight: 700; }
  .goods .vr .r { color: var(--bad); font-weight: 700; }

  .trunk { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .slotc { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
           background: var(--panel-2); border: 1px dashed var(--line); border-radius: 9px;
           font-size: clamp(17px, 5.4vw, 24px); cursor: pointer; }
  .slotc.empty { opacity: .45; cursor: default; }

  .meter { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-dim); flex-wrap: wrap; }
  .meter b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .meter .pct { font-weight: 700; }
  .pct.ok { color: var(--good); } .pct.mid { color: var(--gold); } .pct.no { color: var(--bad); }

  .go { width: 100%; padding: 13px; font-size: 17px; font-weight: 700; border-color: var(--gold); margin-top: auto; }
  .btns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
  .btns2 button { padding: 12px 6px; font-weight: 700; }

  .roadline { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-dim); flex-wrap: wrap; }
  .roadline .pt { padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .roadline .pt.now { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .roadline .pt.ok { border-color: var(--good); color: var(--good); }
  .roadline .arr { opacity: .6; }

  .log { font-size: 12px; color: var(--ink-dim); line-height: 1.6; }
  .log b { color: var(--ink); }
  .stars { font-size: 26px; letter-spacing: 4px; text-align: center; }
  .resg { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 13px; color: var(--ink-dim); justify-content: center; }
  .resg b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .foot { color: var(--ink-dim); font-size: 12.5px; line-height: 1.4; text-align: center; }
  .foot a { color: var(--ink-dim); }

  /* zbijanje da sve stane u jedan ekran */
  @media (max-height: 780px) { .foot { display: none; } }
  @media (max-height: 700px) {
    .wrap { gap: 7px; padding: 6px 10px 8px; }
    header .sub { display: none; }
    .stage { min-height: 0; padding: 12px; gap: 8px; }
    .stage h2 { font-size: 16px; }
    .stage .dim { font-size: 12px; }
    .stage .big { font-size: 30px; }
    .go { padding: 11px; font-size: 16px; }
    .goods button { padding: 6px 2px; }
    .goods .em { font-size: 20px; }
  }
  @media (max-height: 600px) {
    header h1 { font-size: 15px; }
    .stage { padding: 10px; gap: 6px; }
    .stage h2 { font-size: 15px; }
    .stage .dim { font-size: 11.5px; line-height: 1.35; }
    .stage .big { font-size: 24px; }
    .roadline { font-size: 11px; gap: 3px; }
    .roadline .pt { padding: 1px 6px; }
    .go { padding: 9px; font-size: 15px; }
    .btns2 button { padding: 9px 5px; font-size: 13px; }
    .meter { font-size: 12px; gap: 7px; }
    .goods .em { font-size: 18px; }
    .goods .nm { font-size: 9px; }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    .wrap { gap: 5px; padding: 4px 10px 6px; }
    header { padding: 0 0 0 10px; }
    .bar { font-size: 12px; }
    .stage { padding: 8px; gap: 5px; }
    .goods button { padding: 4px 2px; }
    .goods .em { font-size: 16px; }
    .goods .vr { font-size: 9px; }
    .slotc { font-size: 15px; border-radius: 7px; }
    .trunk { gap: 4px; }
    .stage .big { font-size: 20px; }
    .stage h2 { font-size: 14px; }
    .stage .dim { font-size: 11px; line-height: 1.3; }
    .meter { font-size: 11px; gap: 6px; }
    .go { padding: 8px; font-size: 14px; }
    .btns2 button { padding: 7px 4px; font-size: 12px; }
  }
</style>

<body data-theme="dark">
<div class="wrap">
  <header class="col">
    <div>
      <h1>Švercer</h1>
      <div class="sub">Natovari, prođi punktove, prodaj na vreme — radi offline</div>
    </div>
    <div class="spacer"></div>
    <button id="theme" title="Svetla/tamna tema">☀︎ / ☾</button>
  </header>

  <div class="bar col">
    <span class="mode" id="modeLbl"></span>
    <button id="restart" title="Ispočetka">⟲</button>
    <div class="spacer"></div>
    <span>Tura <b id="turaLbl">1</b>/5</span>
    <span>💰 <b id="bank">0</b> poena</span>
  </div>

  <div class="stage col" id="stage"></div>

</div>

<script src="igre.js"></script>
<script>
"use strict";
const KEY = "svercer.v1", DKEY = "svercer.daily", THEME_KEY = "sudoku.theme";
const $ = s => document.querySelector(s);

/* ---------- roba i pravila ---------- */
const GOODS = [
  { em: "☕", nm: "kafa", v: 2, r: 1 },
  { em: "👖", nm: "farmerke", v: 3, r: 2 },
  { em: "⛽", nm: "gorivo", v: 4, r: 3 },
  { em: "🚬", nm: "cigarete", v: 6, r: 5 },
  { em: "💎", nm: "zlato", v: 10, r: 8 }
];
const CAP = 8, NTURA = 5;
const MULT = [1.5, 2, 3];
const MOODS = [{ em: "😴", nm: "dremljiv", d: -6 }, { em: "😐", nm: "ravnodušan", d: 0 }, { em: "👮", nm: "oštar", d: 7 }];
const CROSS = ["Horgoš", "Batrovci", "Bajakovo", "Röszke", "Tompa", "Kelebija", "Evzoni", "Bogorodica", "Gradina", "Preševo", "Šid", "Kotroman"];

const pProc = (risk, mood) => Math.max(2, Math.min(90, 4 + risk + mood));
const cargoVal = c => c.reduce((s, t) => s + GOODS[t].v, 0);
const cargoRisk = c => c.reduce((s, t) => s + GOODS[t].r, 0);

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildWorld(seed) {
  const rnd = mulberry32(seed);
  const ture = [];
  for (let i = 0; i < NTURA; i++) {
    const names = CROSS.slice();
    const route = [];
    for (let k = 0; k < 3; k++) route.push(names.splice((rnd() * names.length) | 0, 1)[0]);
    const moods = [], rolls = [];
    for (let k = 0; k < 3; k++) {
      const m = rnd(); moods.push(m < .27 ? 0 : m < .75 ? 1 : 2);
      rolls.push(rnd());
    }
    ture.push({ route, moods, rolls });
  }
  return { seed, ture };
}

/* ---------- orakl: najbolji pun tovar uz poznatu sudbinu (bez izbacivanja) ---------- */
function oracleTura(T) {
  let best = 0, bestC = null;
  const passK = (risk, k) => T.rolls[k] * 100 >= pProc(risk, MOODS[T.moods[k]].d);
  for (let a = 0; a <= CAP; a++) for (let b = 0; a + b <= CAP; b++) for (let c = 0; a + b + c <= CAP; c++)
    for (let d = 0; a + b + c + d <= CAP; d++) for (let e = 0; a + b + c + d + e <= CAP; e++) {
      const val = a * 2 + b * 3 + c * 4 + d * 6 + e * 10;
      if (!val) continue;
      const risk = a * 1 + b * 2 + c * 3 + d * 5 + e * 8;
      let sc = 0;
      if (passK(risk, 0)) { sc = Math.round(val * MULT[0]);
        if (passK(risk, 1)) { sc = val * MULT[1];
          if (passK(risk, 2)) sc = val * MULT[2]; } }
      if (sc > best) { best = sc; bestC = [a, b, c, d, e]; }
    }
  return { best, bestC };
}

/* ---------- stanje ---------- */
let W = null, ST = null;
// ST = {mode, seed, tura, phase, cargo[], bank, log[], punkt, rolled}
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { } }
function dayNum() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function dayLabel() { const d = new Date(); return d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear() + "."; }

function newRun(mode, seed) {
  W = buildWorld(seed);
  ST = { mode, seed, tura: 0, phase: "shop", cargo: [], bank: 0, log: [], punkt: 0 };
  render(); save();
}

/* ---------- faze ---------- */
function shopHTML() {
  const T = W.ture[ST.tura];
  const risk = cargoRisk(ST.cargo), val = cargoVal(ST.cargo);
  let surv = 1; for (let k = 0; k < 3; k++) surv *= 1 - pProc(risk, 0) / 100;
  const pc = Math.round(surv * 100);
  return '<h2>🛒 Nabavka — tura ' + (ST.tura + 1) + '</h2>' +
    '<div class="dim">Ruta: ' + T.route.join(" → ") + ' → pijaca. Tapni robu da je ubaciš, tapni u gepeku da izbaciš.</div>' +
    '<div class="goods">' + GOODS.map((g, i) =>
      '<button data-g="' + i + '"><span class="em">' + g.em + '</span><span class="nm">' + g.nm + '</span>' +
      '<span class="vr"><span class="v">' + g.v + 'p</span>/<span class="r">' + g.r + '</span></span></button>').join("") + '</div>' +
    trunkHTML(true) +
    '<div class="meter"><span>Vrednost <b>' + val + 'p</b> (pijaca <b>' + val * 3 + 'p</b>)</span>' +
    '<span>Rizik <b>' + risk + '</b></span>' +
    '<span>Sva 3 punkta: <span class="pct ' + (pc >= 60 ? "ok" : pc >= 30 ? "mid" : "no") + '">~' + pc + '%</span></span></div>' +
    '<button class="go" id="goBtn"' + (val ? "" : " disabled") + '>🚙 Kreni</button>';
}
function trunkHTML(interactive) {
  let h = '<div class="trunk">';
  for (let i = 0; i < CAP; i++) {
    const t = ST.cargo[i];
    h += t === undefined ? '<div class="slotc empty"></div>'
      : '<div class="slotc" data-i="' + i + '">' + GOODS[t].em + '</div>';
  }
  return h + '</div>';
}
function roadHTML() {
  const T = W.ture[ST.tura];
  let h = '<div class="roadline">';
  for (let k = 0; k < 3; k++) {
    h += '<span class="pt' + (k < ST.punkt ? " ok" : k === ST.punkt ? " now" : "") + '">' +
      (k < ST.punkt ? "✔ " : "") + T.route[k] + '</span>';
    h += '<span class="arr">→</span>';
  }
  return h + '<span class="pt">🏪 pijaca ×3</span></div>';
}
function punktHTML() {
  const T = W.ture[ST.tura], k = ST.punkt;
  const mood = MOODS[T.moods[k]];
  const risk = cargoRisk(ST.cargo), val = cargoVal(ST.cargo);
  const p = pProc(risk, mood.d);
  return '<h2>🛂 Punkt ' + (k + 1) + ': ' + T.route[k] + '</h2>' + roadHTML() +
    '<div class="big">' + mood.em + '</div>' +
    '<div class="dim" style="text-align:center">Carinik je <b>' + mood.nm + '</b>. ' +
    'Šansa pregleda uz ovaj tovar: <b>' + p + '%</b></div>' +
    trunkHTML(true) +
    '<div class="meter"><span>Vrednost <b>' + val + 'p</b></span><span>Rizik <b>' + risk + '</b></span>' +
    '<span class="dim">tapni robu da je baciš kroz prozor</span></div>' +
    '<button class="go" id="goBtn">🎲 Teraj kroz punkt</button>';
}
function passedHTML() {
  const k = ST.punkt;                           // upravo prošao punkt k-1? ne: passed za punkt k
  const val = cargoVal(ST.cargo);
  const sellNow = k === 0 ? Math.round(val * MULT[0]) : val * MULT[k];
  const T = W.ture[ST.tura];
  return '<h2>✅ Prošao si ' + T.route[k] + '!</h2>' + roadWithPass(k) +
    '<div class="big">😮‍💨</div>' +
    trunkHTML(false) +
    '<div class="btns2">' +
    '<button id="sellBtn">💰 Prodaj ovde<br>×' + MULT[k] + ' = ' + sellNow + 'p</button>' +
    '<button id="pushBtn">🚙 Teraj dalje<br>sledeći: ' + T.route[k + 1] + '</button>' +
    '</div>';
}
function roadWithPass(k) {
  const T = W.ture[ST.tura];
  let h = '<div class="roadline">';
  for (let j = 0; j < 3; j++) {
    h += '<span class="pt' + (j <= k ? " ok" : "") + '">' + (j <= k ? "✔ " : "") + T.route[j] + '</span><span class="arr">→</span>';
  }
  return h + '<span class="pt">🏪 pijaca ×3</span></div>';
}
function turaEnd(points, txt) {
  ST.log.push(points);
  ST.bank += points;
  ST.phase = "summary"; ST.sumTxt = txt; ST.sumPts = points;
  render(); save();
}
function summaryHTML() {
  const last = ST.tura === NTURA - 1;
  return '<h2>' + (ST.sumPts > 0 ? "💰 Tura gotova" : "🚨 Tura propala") + '</h2>' +
    '<div class="big">' + (ST.sumPts > 0 ? "+" + ST.sumPts + "p" : "0p") + '</div>' +
    '<div class="dim" style="text-align:center">' + ST.sumTxt + '</div>' +
    '<div class="log">Ture: ' + ST.log.map((x, i) => "<b>" + x + "</b>").join(" · ") + '</div>' +
    '<button class="go" id="goBtn">' + (last ? "📊 Konačan obračun" : "➡ Sledeća tura") + '</button>';
}
function finalHTML() {
  let oSum = 0;
  const obest = W.ture.map(T => { const o = oracleTura(T); oSum += o.best; return o; });
  const tot = ST.bank;
  const ratio = oSum ? tot / oSum : 0;
  const stars = ratio >= .7 ? 3 : ratio >= .45 ? 2 : ratio >= .22 ? 1 : 0;
  window.TOP && window.TOP.upisi("svercer", ST.mode === "daily" ? "dnevna" : "slobodna", tot,
    "⭐".repeat(stars) || "🐢");
  const bestMix = obest[0].bestC ? obest.map(o => o.bestC ? o.bestC.map((n, i) => n ? n + GOODS[i].em : "").join("") : "—") : [];
  if (ST.mode === "daily") {
    try {
      const all = JSON.parse(localStorage.getItem(DKEY) || "{}");
      const prev = all[String(dayNum())];
      if (!prev || tot > prev.t) all[String(dayNum())] = { t: tot, stars };
      localStorage.setItem(DKEY, JSON.stringify(all));
    } catch (e) { }
  }
  ST.shareTxt = "Švercer 🚬 " + (ST.mode === "daily" ? dayLabel() : "slobodna") + " — " + tot + "p " +
    ("⭐".repeat(stars) || "🐢") + " (savršen švercer " + oSum + "p) | ture: " + ST.log.join("+");
  return '<h2>📊 Kraj sezone</h2>' +
    '<div class="stars">' + ("⭐".repeat(stars) || "🐢") + '</div>' +
    '<div class="resg">' +
    '<span>Tvoj pazar</span><b>' + tot + ' poena</b>' +
    '<span>Savršen švercer (sveznajući)</span><b>' + oSum + ' poena</b>' +
    '<span>Po turama</span><b>' + ST.log.join(" · ") + '</b>' +
    '</div>' +
    '<div class="log" style="text-align:center">Njegov tovar: ' + obest.map(o => o.bestC ? o.bestC.map((n, i) => n ? n + GOODS[i].em : "").join("") || "prazan" : "—").join(" | ") + '</div>' +
    '<div class="btns2"><button id="shareBtn">📋 Podeli</button>' +
    '<button id="goBtn">' + (ST.mode === "daily" ? "🎲 Slobodna igra" : "🎲 Nova sezona") + '</button></div>' +
    (ST.mode === "daily" ? '<button id="retryBtn">⟲ Današnja ponovo</button>' : '');
}
function introHTML() {
  let dtxt = "";
  try {
    const d = JSON.parse(localStorage.getItem(DKEY) || "{}")[String(dayNum())];
    if (d) dtxt = '<div class="dim" style="text-align:center">Današnja najbolja: <b>' + d.t + 'p ' + "⭐".repeat(d.stars) + '</b></div>';
  } catch (e) { }
  return '<h2>🚬 Švercer</h2>' +
    '<div class="dim">Pet tura. U svakoj: natovari gepek (8 mesta), pa kroz <b>tri punkta</b>. ' +
    'Vredna roba nosi veći rizik pregleda. Posle svakog prođenog punkta biraš: <b>prodaj</b> (×1,5 pa ×2) ' +
    'ili <b>teraj do pijace</b> (×3). Padneš li na pregledu — sve ti uzmu. ' +
    'Na punktu vidiš raspoloženje carinika i još uvek možeš da baciš robu kroz prozor.</div>' + dtxt +
    '<div class="btns2"><button id="dailyBtn">📅 Dnevna sezona</button><button id="freeBtn">🎲 Slobodna igra</button></div>';
}

/* ---------- render + akcije ---------- */
function render() {
  const st = $("#stage");
  if (!ST) { st.innerHTML = introHTML(); wireIntro(); return; }
  $("#turaLbl").textContent = Math.min(ST.tura + 1, NTURA);
  $("#bank").textContent = ST.bank;
  $("#modeLbl").textContent = ST.mode === "daily" ? "📅 " + dayLabel() : "🎲 slobodna";
  if (ST.phase === "shop") st.innerHTML = shopHTML();
  else if (ST.phase === "punkt") st.innerHTML = punktHTML();
  else if (ST.phase === "passed") st.innerHTML = passedHTML();
  else if (ST.phase === "summary") st.innerHTML = summaryHTML();
  else if (ST.phase === "final") st.innerHTML = finalHTML();
  wire();
}
function wireIntro() {
  $("#dailyBtn").onclick = () => newRun("daily", dayNum());
  $("#freeBtn").onclick = () => newRun("free", (Math.random() * 2 ** 31) | 0);
}
function wire() {
  for (const b of document.querySelectorAll(".goods button"))
    b.onclick = () => { if (ST.cargo.length < CAP) { ST.cargo.push(+b.dataset.g); window.SFX && SFX.tap(); render(); save(); } };
  for (const d of document.querySelectorAll(".trunk .slotc[data-i]"))
    d.onclick = () => {
      if (ST.phase !== "shop" && ST.phase !== "punkt") return;
      ST.cargo.splice(+d.dataset.i, 1); window.SFX && SFX.tick(); render(); save();
    };
  const go = $("#goBtn");
  if (go) go.onclick = () => {
    if (ST.phase === "shop") { ST.phase = "punkt"; ST.punkt = 0; window.SFX && SFX.engine(); render(); save(); }
    else if (ST.phase === "punkt") roll();
    else if (ST.phase === "summary") nextTura();
    else if (ST.phase === "final") newRun("free", (Math.random() * 2 ** 31) | 0);
  };
  const sb = $("#sellBtn");
  if (sb) sb.onclick = () => {
    const val = cargoVal(ST.cargo), k = ST.punkt;
    const pts = k === 0 ? Math.round(val * MULT[0]) : val * MULT[k];
    window.SFX && SFX.coin();
    turaEnd(pts, "Prodao si na " + W.ture[ST.tura].route[k] + " uz množilac ×" + MULT[k] + ".");
  };
  const pb = $("#pushBtn");
  if (pb) pb.onclick = () => { ST.punkt++; ST.phase = "punkt"; window.SFX && SFX.engine(); render(); save(); };
  const shb = $("#shareBtn");
  if (shb) shb.onclick = () => {
    try { navigator.clipboard.writeText(ST.shareTxt).then(() => shb.textContent = "✔ Kopirano", () => prompt("Kopiraj:", ST.shareTxt)); }
    catch (e) { prompt("Kopiraj:", ST.shareTxt); }
  };
  const rb = $("#retryBtn");
  if (rb) rb.onclick = () => newRun("daily", dayNum());
}
function roll() {
  const T = W.ture[ST.tura], k = ST.punkt;
  const p = pProc(cargoRisk(ST.cargo), MOODS[T.moods[k]].d);
  const caught = T.rolls[k] * 100 < p;
  const st = $("#stage");
  st.innerHTML = '<h2>🛂 ' + T.route[k] + '</h2>' + roadHTML() +
    '<div class="big">🔦</div><div class="dim" style="text-align:center">Carinik gleda…</div>' + trunkHTML(false);
  window.SFX && SFX.drum();
  setTimeout(() => {
    if (caught) {
      window.SFX && SFX.siren();
      const lost = cargoVal(ST.cargo);
      ST.cargo = [];
      turaEnd(0, "Pregled na " + T.route[k] + "! Oduzeše ti robu vrednu " + lost + "p (na pijaci bi bila " + lost * 3 + "p).");
    } else if (k >= 2) {
      window.SFX && (SFX.stamp(), setTimeout(SFX.win, 250));
      turaEnd(cargoVal(ST.cargo) * 3, "Stigao si do pijace — pun pazar ×3!");
    } else { ST.phase = "passed"; window.SFX && SFX.stamp(); render(); save(); }
  }, 900);
}
function nextTura() {
  if (ST.tura >= NTURA - 1) { ST.phase = "final"; render(); save(); return; }
  ST.tura++; ST.cargo = []; ST.punkt = 0; ST.phase = "shop";
  render(); save();
}

/* ---------- start ---------- */
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!s || typeof s.seed !== "number" || s.phase === "final") return false;
    if (s.mode === "daily" && s.seed !== dayNum()) return false;
    W = buildWorld(s.seed); ST = s;
    render(); return true;
  } catch (e) { return false; }
}
$("#restart").onclick = () => { if (!ST || confirm("Ispočetka? Trenutna sezona se briše.")) { ST = null; try { localStorage.removeItem(KEY); } catch (e) { } render(); } };
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) { }
};
window.addEventListener("pagehide", save);
try { const t = localStorage.getItem(THEME_KEY); if (t) document.body.dataset.theme = t; } catch (e) { }
if (!load()) render();

window.G = { get W() { return W; }, get ST() { return ST; }, buildWorld, oracleTura, pProc, cargoVal, cargoRisk, newRun, MULT };
</script>
</body>
</html>
