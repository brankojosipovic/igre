  :root {

  .tabovi button.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, var(--panel)); }
  .alat { display: flex; align-items: center; gap: 6px; }

  .savetnik { font-size: 12px; color: var(--ink-dim); text-align: center; min-height: 17px; }

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "kuca.v2";
const cv = $("#cv"), ctx = cv.getContext("2d");

/* ================= SOBE I NAMEŠTAJ ================= */
/* Podovi su svetli, kao na pravom tlocrtu — tako se nameštaj vidi.
   Boja je samo nagoveštaj koja je soba, a natpis i traka gore to kažu do kraja. */
const SOBE = {
  dnevna:   { nm: "Dnevna soba", em: "🛋", pod: "#d9c9a8", pod2: "#cdbb96", crta: "#7a6134", tag: "#3f8a5f" },
  spavaca:  { nm: "Spavaća",     em: "🛏", pod: "#d5cadd", pod2: "#c6b9d1", crta: "#6b5a80", tag: "#7a63a8" },
  kuhinja:  { nm: "Kuhinja",     em: "🍳", pod: "#dcd8cb", pod2: "#cec9b9", crta: "#7a7460", tag: "#b08a34" },
  kupatilo: { nm: "Kupatilo",    em: "🛁", pod: "#cfdde5", pod2: "#bdcfda", crta: "#5c7684", tag: "#3f87a8" },
  hodnik:   { nm: "Hodnik",      em: "🚪", pod: "#d6d5d2", pod2: "#c7c6c2", crta: "#6f6e6a", tag: "#7d7d84" },
  decija:   { nm: "Dečija soba", em: "🧸", pod: "#e3d3d6", pod2: "#d5c2c6", crta: "#7f6467", tag: "#b0607a" }
};
/* ================= CRTEŽI NAMEŠTAJA (pogled odozgo) =================
   Svaki crtež se crta u pravougaonik (0,0)–(w,h), pri čemu je gornja ivica
   „leđa“ komada — ona koja ide uza zid. Okretanje radi sama funkcija crtaj. */
const BOJE = {
  drvo: "#a97a44", drvoT: "#8a5f2e", drvoS: "#c39a63",
  tkanina: "#8593a8", tkaninaT: "#6d7b90", tkaninaS: "#9dabc0",
  belo: "#eef1f5", beloT: "#ccd3db", metal: "#aab3bd", metalT: "#8b949e",
  tamno: "#2c3138", staklo: "#9fc4d8", zelen: "#3f8a4d", zelenT: "#2c6337",
  jorgan: "#c9d3e2", jastuk: "#f2f4f8", plocice: "#dfe6ec"
};
function pr(c, x, y, w, h, r, boja, ivica, deb) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r || 0); else c.rect(x, y, w, h);
  if (boja) { c.fillStyle = boja; c.fill(); }
  if (ivica) { c.strokeStyle = ivica; c.lineWidth = deb || 1; c.stroke(); }
}
function krug(c, x, y, r, boja, ivica, deb) {
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
  if (boja) { c.fillStyle = boja; c.fill(); }
  if (ivica) { c.strokeStyle = ivica; c.lineWidth = deb || 1; c.stroke(); }
}
const CRTEZ = {
  kauc: (c, w, h) => {                                   // naslon gore, dva rukohvata, jastuci
    const d = Math.min(w, h) * .18;
    pr(c, 0, 0, w, h, d * .6, BOJE.tkaninaT);
    pr(c, d, d * 1.1, w - 2 * d, h - d * 1.4, d * .5, BOJE.tkanina);
    const n = Math.max(2, Math.round((w - 2 * d) / (h * .9)));
    for (let i = 0; i < n; i++) {
      const jx = d + (w - 2 * d) / n * i + 2, jw = (w - 2 * d) / n - 4;
      pr(c, jx, d * 1.4, jw, h - d * 2.1, d * .5, BOJE.tkaninaS, BOJE.tkaninaT, 1);
    }
  },
  fotelja: (c, w, h) => {
    const d = Math.min(w, h) * .22;
    pr(c, 0, 0, w, h, d, BOJE.tkaninaT);
    pr(c, d, d * 1.1, w - 2 * d, h - d * 1.5, d * .7, BOJE.tkaninaS, BOJE.tkaninaT, 1);
  },
  krevet: (c, w, h) => {                                 // uzglavlje gore, jorgan, dva jastuka
    const u = h * .1;
    pr(c, 0, 0, w, u, 2, BOJE.drvoT);                    // uzglavlje
    pr(c, 0, u, w, h - u, 3, BOJE.belo, BOJE.beloT, 1);
    pr(c, 1, u + h * .28, w - 2, h - u - h * .29, 3, BOJE.jorgan, BOJE.beloT, 1);
    c.strokeStyle = BOJE.beloT; c.lineWidth = 1;
    c.beginPath(); c.moveTo(2, u + h * .42); c.lineTo(w - 2, u + h * .42); c.stroke();
    const jw = w > h ? w * .22 : w * .42, jh = h * .15;
    if (w >= h * .8) {
      pr(c, w * .06, u + h * .04, jw, jh, 2, BOJE.jastuk, BOJE.beloT, 1);
      pr(c, w - w * .06 - jw, u + h * .04, jw, jh, 2, BOJE.jastuk, BOJE.beloT, 1);
    } else pr(c, (w - jw) / 2, u + h * .04, jw, jh, 2, BOJE.jastuk, BOJE.beloT, 1);
  },
  ormar: (c, w, h) => {                                  // dvokrilni, sa kvakama
    pr(c, 0, 0, w, h, 2, BOJE.drvo, BOJE.drvoT, 1.2);
    c.strokeStyle = BOJE.drvoT; c.lineWidth = 1;
    if (w > h) { const x = w / 2; c.beginPath(); c.moveTo(x, 1); c.lineTo(x, h - 1); c.stroke();
      krug(c, x - 3, h * .5, 1.4, BOJE.metal); krug(c, x + 3, h * .5, 1.4, BOJE.metal); }
    else { const y = h / 2; c.beginPath(); c.moveTo(1, y); c.lineTo(w - 1, y); c.stroke();
      krug(c, w * .5, y - 3, 1.4, BOJE.metal); krug(c, w * .5, y + 3, 1.4, BOJE.metal); }
  },
  komoda: (c, w, h) => {
    pr(c, 0, 0, w, h, 2, BOJE.drvo, BOJE.drvoT, 1.2);
    c.strokeStyle = BOJE.drvoT; c.lineWidth = 1;
    const n = Math.max(2, Math.round(Math.max(w, h) / Math.min(w, h)));
    for (let i = 1; i < n; i++) {
      if (w >= h) { c.beginPath(); c.moveTo(w / n * i, 2); c.lineTo(w / n * i, h - 2); c.stroke(); }
      else { c.beginPath(); c.moveTo(2, h / n * i); c.lineTo(w - 2, h / n * i); c.stroke(); }
    }
    for (let i = 0; i < n; i++) {
      const cx = w >= h ? w / n * (i + .5) : w * .5, cy = w >= h ? h * .5 : h / n * (i + .5);
      pr(c, cx - Math.min(w, h) * .16, cy - 1, Math.min(w, h) * .32, 2, 1, BOJE.metal);
    }
  },
  polica: (c, w, h) => {
    pr(c, 0, 0, w, h, 1, BOJE.drvoT);
    pr(c, 1.5, 1.5, w - 3, h - 3, 1, BOJE.drvoS);
    c.strokeStyle = BOJE.drvoT; c.lineWidth = 1;
    const n = 3;
    for (let i = 1; i < n; i++) {
      if (w >= h) { c.beginPath(); c.moveTo(w / n * i, 2); c.lineTo(w / n * i, h - 2); c.stroke(); }
      else { c.beginPath(); c.moveTo(2, h / n * i); c.lineTo(w - 2, h / n * i); c.stroke(); }
    }
  },
  tv: (c, w, h) => {                                     // komoda sa ekranom
    pr(c, 0, h * .45, w, h * .55, 2, BOJE.drvo, BOJE.drvoT, 1);
    pr(c, w * .12, h * .04, w * .76, h * .42, 1.5, BOJE.tamno, "#0d1014", 1);
    pr(c, w * .16, h * .09, w * .68, h * .3, 1, "#3b4a5c");
  },
  sto: (c, w, h) => {                                    // trpezarijski, ploča sa venom
    pr(c, 0, 0, w, h, Math.min(w, h) * .12, BOJE.drvo, BOJE.drvoT, 1.4);
    c.strokeStyle = "rgba(120,80,40,.35)"; c.lineWidth = 1;
    for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(w * .12, h / 4 * i); c.lineTo(w * .88, h / 4 * i); c.stroke(); }
  },
  stocic: (c, w, h) => {
    pr(c, 0, 0, w, h, Math.min(w, h) * .2, BOJE.drvoS, BOJE.drvoT, 1.2);
    pr(c, w * .18, h * .18, w * .64, h * .64, Math.min(w, h) * .12, "rgba(255,255,255,.14)");
  },
  stolica: (c, w, h) => {
    pr(c, w * .1, h * .22, w * .8, h * .72, 2, BOJE.drvo, BOJE.drvoT, 1);
    pr(c, w * .06, 0, w * .88, h * .18, 1.5, BOJE.drvoT);
  },
  sporet: (c, w, h) => {                                 // četiri ringle i dugmad
    pr(c, 0, 0, w, h, 2, BOJE.belo, BOJE.beloT, 1.2);
    pr(c, w * .08, h * .22, w * .84, h * .7, 2, "#3a4048");
    const r = Math.min(w, h) * .13;
    krug(c, w * .3, h * .42, r, "#20252b", "#585f68", 1);
    krug(c, w * .7, h * .42, r, "#20252b", "#585f68", 1);
    krug(c, w * .3, h * .74, r, "#20252b", "#585f68", 1);
    krug(c, w * .7, h * .74, r, "#20252b", "#585f68", 1);
    for (let i = 0; i < 4; i++) krug(c, w * (.2 + i * .2), h * .1, Math.min(w, h) * .05, BOJE.metalT);
  },
  frizider: (c, w, h) => {
    pr(c, 0, 0, w, h, 2, BOJE.belo, BOJE.beloT, 1.2);
    c.strokeStyle = BOJE.beloT; c.lineWidth = 1;
    c.beginPath(); c.moveTo(2, h * .38); c.lineTo(w - 2, h * .38); c.stroke();
    pr(c, w * .76, h * .1, 2.5, h * .2, 1, BOJE.metal);
    pr(c, w * .76, h * .5, 2.5, h * .32, 1, BOJE.metal);
  },
  sudopera: (c, w, h) => {
    pr(c, 0, 0, w, h, 2, BOJE.metal, BOJE.metalT, 1.2);
    pr(c, w * .1, h * .24, w * .55, h * .6, 2, "#8e979f", "#6f777e", 1);
    krug(c, w * .375, h * .54, Math.min(w, h) * .07, "#5c646b");
    pr(c, w * .78, h * .18, 2, h * .3, 1, BOJE.metalT);   // slavina
    krug(c, w * .79, h * .16, Math.min(w, h) * .07, BOJE.metalT);
  },
  kuhinjaElement: (c, w, h) => {
    pr(c, 0, 0, w, h, 2, BOJE.drvoS, BOJE.drvoT, 1.2);
    pr(c, 0, 0, w, h * .18, 1, "#6f7780");                // radna ploča
    c.strokeStyle = BOJE.drvoT; c.lineWidth = 1;
    const n = Math.max(2, Math.round(w / h));
    for (let i = 1; i < n; i++) { c.beginPath(); c.moveTo(w / n * i, h * .2); c.lineTo(w / n * i, h - 2); c.stroke(); }
  },
  kada: (c, w, h) => {
    pr(c, 0, 0, w, h, Math.min(w, h) * .18, BOJE.belo, BOJE.beloT, 1.4);
    pr(c, w * .08, h * .14, w * .84, h * .72, Math.min(w, h) * .22, "#dbe6ee", BOJE.beloT, 1);
    krug(c, w * .18, h * .5, Math.min(w, h) * .06, "#aab6c0");
    pr(c, w * .88, h * .4, 2, h * .2, 1, BOJE.metalT);
  },
  tus: (c, w, h) => {
    pr(c, 0, 0, w, h, 2, BOJE.plocice, BOJE.beloT, 1.2);
    pr(c, w * .1, h * .1, w * .8, h * .8, 2, "rgba(159,196,216,.5)", "#8fb2c6", 1);
    krug(c, w * .5, h * .5, Math.min(w, h) * .09, "#8b949e");
    c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(w * .12, h * .88); c.lineTo(w * .88, h * .12); c.stroke();
  },
  wc: (c, w, h) => {
    pr(c, w * .12, 0, w * .76, h * .28, 2, BOJE.belo, BOJE.beloT, 1.2);   // vodokotlić
    c.beginPath();
    c.ellipse(w * .5, h * .62, w * .32, h * .3, 0, 0, Math.PI * 2);
    c.fillStyle = BOJE.belo; c.fill(); c.strokeStyle = BOJE.beloT; c.lineWidth = 1.2; c.stroke();
    c.beginPath();
    c.ellipse(w * .5, h * .64, w * .2, h * .19, 0, 0, Math.PI * 2);
    c.fillStyle = "#dbe6ee"; c.fill();
  },
  lavabo: (c, w, h) => {
    pr(c, 0, 0, w, h * .9, 3, BOJE.belo, BOJE.beloT, 1.2);
    c.beginPath();
    c.ellipse(w * .5, h * .55, w * .34, h * .28, 0, 0, Math.PI * 2);
    c.fillStyle = "#dbe6ee"; c.fill(); c.strokeStyle = BOJE.beloT; c.stroke();
    pr(c, w * .46, h * .06, 2, h * .16, 1, BOJE.metalT);
  },
  vesMasina: (c, w, h) => {
    pr(c, 0, 0, w, h, 2, BOJE.belo, BOJE.beloT, 1.2);
    krug(c, w * .5, h * .58, Math.min(w, h) * .26, "#c9d6e0", "#9fb0bd", 1.2);
    krug(c, w * .5, h * .58, Math.min(w, h) * .17, "#7f8f9c");
    pr(c, w * .12, h * .1, w * .76, h * .12, 1, "#dfe6ec");
  },
  tepih: (c, w, h) => {
    pr(c, 0, 0, w, h, Math.min(w, h) * .08, "#8d5f6b", "#6f4854", 1.2);
    pr(c, w * .08, h * .12, w * .84, h * .76, Math.min(w, h) * .06, "#a8757f");
    pr(c, w * .18, h * .26, w * .64, h * .48, Math.min(w, h) * .05, "#c08d94");
  },
  biljka: (c, w, h) => {
    const cx = w / 2, cy = h * .58, r = Math.min(w, h) * .3;
    krug(c, cx, cy + r * .5, r * .7, "#a86a3c", "#7d4c2a", 1);
    for (let i = 0; i < 7; i++) {

  const kucaZa = ph => Math.max(7, Math.min((sirina - 14) / N.w, (visina - ph - 14) / N.h));

<script>

    if (REZIM === "slobodno") {
      localStorage.setItem(KEY_SLOB, JSON.stringify({
        br: N.br, komadi: N.komadi.filter(k => k.x != null).map(k =>
          ({ nm: k.nm, crt: k.crt, w: k.w, h: k.h, zid: k.zid, tip: k.tip, x: k.x, y: k.y, r: k.rot }))
      }));
      return;
    }
    if (gotovo()) return;
    localStorage.setItem(KEY, JSON.stringify({
      br: N.br, poteza: poteza, saveta: saveta,
      stanje: N.komadi.map(k => ({ i: k.id, x: k.x, y: k.y, r: k.rot }))
    }));
  } catch (e) { }
}
function ucitajSlobodno() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY_SLOB) || "null");
    if (!raw || !raw.br) return false;
    kreniSlobodno(raw.br);
    for (const s of (raw.komadi || []))
      N.komadi.push({ id: sledeciId++, nm: s.nm, crt: s.crt, w: s.w, h: s.h, zid: !!s.zid,
        tip: s.tip, soba: null, rot: s.r | 0, x: s.x, y: s.y });
    osveziHud(); crtaj();
    return true;
  } catch (e) { return false; }
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw || !raw.br || !raw.stanje) return false;
    N = napraviNivo(raw.br);
    for (const s of raw.stanje) {
      const k = N.komadi.find(x => x.id === s.i);
      if (k) { k.x = s.x; k.y = s.y; k.rot = s.r | 0; }
    }
    poteza = raw.poteza || 0; saveta = raw.saveta || 0; pocetak = Date.now();
    return true;
  } catch (e) { return false; }
}

/* ================= MENI ================= */
function meni() {
  const ima = !!localStorage.getItem(KEY);
  const dost = dostignut();
  showOverlay('<h2>🛋 Kuća</h2>' +
    '<div class="btns">' +
    (ima && N ? '<button id="nastBtn">▶ Nastavi — kuća ' + N.br + '</button>' : '') +
    '<button id="novaBtn">🏠 Nova kuća ' + dost + '</button>' +
    '<button id="izborBtn">🔢 Izaberi kuću</button>' +
    '<button id="slobBtn">🎨 Slobodno uređivanje</button>' +
    '<button id="pravBtn">❔ Pravila</button></div>' +
    '<p>Svaki komad nameštaja ide u svoju sobu: krevet u spavaću, šporet u kuhinju. ' +
    'Veliki komadi se naslanjaju uza zid, a ispred vrata ne sme ništa.</p>');
  const nb = $("#nastBtn"); if (nb) nb.onclick = () => { hideOverlay(); osveziHud(); };
  $("#novaBtn").onclick = () => { REZIM = "slagalica"; kreni(dost); };
  $("#izborBtn").onclick = izborKuce;
  $("#slobBtn").onclick = () => { if (!ucitajSlobodno()) kreniSlobodno(dostignut()); };
  $("#pravBtn").onclick = pravila;
}
function izborKuce() {
  const dost = dostignut();
  let rek = {};
  try { rek = JSON.parse(localStorage.getItem("kuca.rekordi") || "{}"); } catch (e) { }
  let h = '<h2>🔢 Izaberi kuću</h2><div class="btns uska" style="max-width:320px">';
  for (let i = 1; i <= Math.max(dost, 1); i++) {
    const r = rek[i];
    h += '<button data-n="' + i + '" style="min-width:64px">' + i +
      (r ? '<br><small style="color:var(--gold)">' + "★".repeat(r.z) + '</small>' : '') + '</button>';
  }
  h += '</div><p>Otvorene su ti kuće do <b>' + dost + '</b>. Svaka je uvek ista — broj je njen crtež.</p>' +
    '<div class="btns"><button id="nazBtn">← Nazad</button></div>';
  showOverlay(h);
  for (const b of document.querySelectorAll("[data-n]")) b.onclick = () => { REZIM = "slagalica"; kreni(+b.dataset.n); };
  $("#nazBtn").onclick = meni;
}
function pravila() {
  showOverlay('<h2>Kako se igra</h2>' +
    '<ul>' +
    '<li><b>Prevuci</b> komad iz police dole u sobu kojoj pripada. Sivi obris ti pokazuje gde bi pao: ' +
    'zeleno znači da može, crveno da ne može.</li>' +
    '<li>Svaki komad ima svoju sobu — <b>krevet u spavaću</b>, šporet u kuhinju, kada u kupatilo. ' +
    'Boja sobe i natpis u uglu ti kažu koja je koja.</li>' +
    '<li>Veliki komadi (krevet, ormar, kauč, kada) <b>moraju uza zid</b> — bar jednom stranicom uz ivicu sobe.</li>' +
    '<li>Polje sa <b>🚶</b> i isprekidanom ivicom je <b>prolaz kroz vrata</b> — mora ostati slobodno.</li>' +
    '<li><b>↻ Okreni</b> obrne komad koji držiš ili si ga dodirnuo. Komad koji je već na podu ' +
    'možeš da podigneš prstom i premestiš.</li>' +
    '<li><b>💡 Pomoć</b> postavi jedan komad umesto tebe, ali ti odnese zvezdicu.</li>' +
    '<li><b>🎨 Slobodno uređivanje</b> je bez zadatka: biraš sobu gore, vučeš nameštaj gde hoćeš, ' +
    'nema pravila o sobama ni o zidu. Komad koji vratiš dole u policu — nestaje. ' +
    'Dugme <b>🏠 Drugi plan</b> daje novu kuću.</li>' +
    '<li>Kad u slobodnom uređivanju dodirneš komad, pojavi se red <b>⬌ − +</b> i <b>⬍ − +</b> ' +
    'kojim mu menjaš veličinu. Jedno polje je <b>40 cm</b>, a mera ti piše ispod stola.</li>' +
    '<li>Tri zvezdice dobijaš kad složiš sve iz prve, bez pomoći.</li>' +
    '</ul>' +
    '<div class="btns"><button id="nazBtn2">← Nazad</button></div>');
  $("#nazBtn2").onclick = meni;
}
function showOverlay(h) { const o = $("#overlay"); o.innerHTML = h; o.hidden = false; }
function hideOverlay() { $("#overlay").hidden = true; }

$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("sudoku.theme", b.dataset.theme); } catch (e) { }
  crtaj();
};
$("#meniBtn2").onclick = meni;

/* ================= START ================= */
try { const t = localStorage.getItem("sudoku.theme"); if (t) document.body.dataset.theme = t; } catch (e) { }
if (!load()) N = napraviNivo(dostignut());
osveziHud(); fit(); meni();

window.K = {
  get N() { return N; }, napraviNivo, mozeNa, zastoNe, kreni, meni, izborKuce, pravila,
  get poteza() { return poteza; }, get saveta() { return saveta; },
  uPolici, postavljeni, gotovo, save, load, dostignut, kw, kh, osveziHud, crtaj, fit, zavrsi, CRTEZ, NAMESTAJ,
  kreniSlobodno, ucitajSlobodno, policaLista, sobaKojaDrzi, promeniMeru, mere, METAR,
  izaberi: id => { izabran = N.komadi.find(k => k.id === id) || null; osveziHud(); crtaj(); },
  get REZIM() { return REZIM; }, get kategorija() { return kategorija; },
  setKategorija: t => { kategorija = t; osveziHud(); crtaj(); },
  dodaj: (crt, nm, w, h, x, y, rot, tip) => {
    const k = { id: sledeciId++, nm: nm, crt: crt, w: w, h: h, zid: false, tip: tip || "dnevna",
      soba: null, rot: rot | 0, x: null, y: null };
    N.komadi.push(k);
    if (!mozeNa(k, x, y)) { N.komadi.pop(); return false; }
    k.x = x; k.y = y; osveziHud(); crtaj(); save(); return true;
  },
  get R() { return R; },
  postavi: (id, x, y, rot) => {
    const k = N.komadi.find(z => z.id === id);
    if (!k) return false;
    if (rot != null) k.rot = rot | 0;
    if (!mozeNa(k, x, y)) return false;
    k.x = x; k.y = y; poteza++;
    osveziHud(); crtaj();
    if (gotovo()) zavrsi();
    return true;
  },
  resi: () => {
    for (const k of N.komadi) { k.rot = k.resenje.rot; k.x = k.resenje.x; k.y = k.resenje.y; }
    osveziHud(); crtaj();
    if (gotovo()) zavrsi();
  },
  skloni: id => { const k = N.komadi.find(z => z.id === id); if (k) { k.x = null; k.y = null; } osveziHud(); crtaj(); }
};
</script>
