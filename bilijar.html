<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "bilijar.v1";
const cv = $("#cv"), ctx = cv.getContext("2d");

/* ================= STO ================= */
/* Igralište je 100 × 200 jedinica — pravi odnos bilijarskog stola. */
const W = 100, H = 200;
const TAU = Math.PI * 2;
let R = 2.4;                                   // poluprečnik lopte (snuker ima manje)
let GAP = 8.2, GAPS = 6.2, JR = 0.9;           // otvor ćoška, otvor sredine, poluprečnik čeljusti

const TRENJE = 21;                             // usporenje kotrljanja (jedinica/s²)
const PRAG = 1.6;                              // ispod ove brzine lopta staje
const ODBOJ = 0.76;                            // odskok od bande
const SUDAR = 0.96;                            // prenos pri sudaru lopti
const NAJJACE = 280;                           // brzina pri sto posto snage

function mereZaIgru(igra) {
  R = igra === "snuker" ? 1.95 : 2.4;
  GAP = R * 3.4;                                // ćošak prima oko dve i po lopte, kao na pravom stolu
  GAPS = R * 2.6;                               // sredina je uža
  JR = R * 0.38;
}
/* Rupa je udubljenje iza otvora: x,y je grlo koje hvata loptu (iza bande),
   a ax,ay je tačka u otvoru u koju se nišani — kao kad gađaš sredinu rupe. */
function rupe() {
  const cu = R * 1.0, cr = R * 3.0, ca = R * 0.85;      // ćoškovi
  const su = R * 1.25, sr = R * 2.1, sa = R * 0.25;     // sredine
  return [
    { x: -cu, y: -cu, r: cr, ax: ca, ay: ca },
    { x: W + cu, y: -cu, r: cr, ax: W - ca, ay: ca },
    { x: -su, y: H / 2, r: sr, ax: sa, ay: H / 2, sredina: true },
    { x: W + su, y: H / 2, r: sr, ax: W - sa, ay: H / 2, sredina: true },
    { x: -cu, y: H + cu, r: cr, ax: ca, ay: H - ca },
    { x: W + cu, y: H + cu, r: cr, ax: W - ca, ay: H - ca }
  ];
}
function celjusti() {                           // male oble prepreke na ivicama otvora
  const o = [];
  const par = (x, y) => o.push({ x: x, y: y });
  par(GAP, -JR); par(-JR, GAP);                          // gore levo
  par(W - GAP, -JR); par(W + JR, GAP);                   // gore desno
  par(GAP, H + JR); par(-JR, H - GAP);                   // dole levo
  par(W - GAP, H + JR); par(W + JR, H - GAP);            // dole desno
  par(-JR, H / 2 - GAPS); par(-JR, H / 2 + GAPS);        // sredina levo
  par(W + JR, H / 2 - GAPS); par(W + JR, H / 2 + GAPS);  // sredina desno
  return o;
}
let RUPE = rupe(), CELJUSTI = celjusti();

/* ================= LOPTE ================= */
let lopte = [];
const bela = () => lopte.find(b => b.bela);
const zive = () => lopte.filter(b => b.ziva);
function lopta(o) {
  return Object.assign({ x: 0, y: 0, vx: 0, vy: 0, sx: 0, sy: 0, ziva: true, bela: false,
    br: 0, boja: "#eee", pruga: false, tip: "puna", vred: 0 }, o);
}
const BOJE = { 1: "#f2c018", 2: "#1f5fbf", 3: "#cf2b2b", 4: "#6b3fa0", 5: "#e07c1f",
  6: "#1f8a4c", 7: "#8a3b2a", 8: "#15171b", 9: "#f2c018", 10: "#1f5fbf", 11: "#cf2b2b",
  12: "#6b3fa0", 13: "#e07c1f", 14: "#1f8a4c", 15: "#8a3b2a" };
const SNUKER = { crvena: { b: "#c1272d", v: 1 }, zuta: { b: "#e8c11c", v: 2 }, zelena: { b: "#12764a", v: 3 },
  braon: { b: "#7a4a22", v: 4 }, plava: { b: "#1b62c4", v: 5 }, roze: { b: "#e88ba6", v: 6 }, crna: { b: "#141518", v: 7 } };
const REDOM = ["zuta", "zelena", "braon", "plava", "roze", "crna"];

function postaviOsmicu() {
  mereZaIgru("osmica");
  lopte = [];
  lopte.push(lopta({ x: W / 2, y: H * 0.75, bela: true, boja: "#f6f4ee", tip: "bela" }));
  /* trougao: vrh okrenut ka beloj, osmica u sredini treće vrste */
  const redosled = [1, 11, 5, 2, 8, 10, 9, 3, 14, 7, 12, 6, 15, 13, 4];
  const vrh = { x: W / 2, y: H * 0.25 }, korak = 2 * R * 1.02, visina = korak * 0.866;
  let k = 0;
  for (let i = 0; i < 5; i++) {
    for (let j = 0; j <= i; j++) {
      const br = redosled[k++];
      lopte.push(lopta({
        x: vrh.x - i * korak / 2 + j * korak, y: vrh.y - i * visina,
        br: br, boja: BOJE[br], pruga: br > 8, tip: br === 8 ? "crna" : (br < 8 ? "puna" : "prugasta")
      }));
    }
  }
}
function postaviSnuker() {
  mereZaIgru("snuker");
  lopte = [];
  const yBaulk = H * 0.7935, dR = 16.4;
  lopte.push(lopta({ x: W / 2 - 8, y: yBaulk, bela: true, boja: "#f6f4ee", tip: "bela" }));
  const boja = (ime, x, y) => lopte.push(lopta({
    x: x, y: y, boja: SNUKER[ime].b, tip: ime, vred: SNUKER[ime].v
  }));
  boja("zuta", W / 2 + dR, yBaulk);
  boja("zelena", W / 2 - dR, yBaulk);
  boja("braon", W / 2, yBaulk);
  boja("plava", W / 2, H / 2);
  boja("roze", W / 2, H * 0.255);
  boja("crna", W / 2, H * 0.0908);
  const korak = 2 * R * 1.03, visina = korak * 0.866;
  const vrhY = H * 0.255 - korak * 1.05;
  for (let i = 0; i < 5; i++)
    for (let j = 0; j <= i; j++)
      lopte.push(lopta({ x: W / 2 - i * korak / 2 + j * korak, y: vrhY - i * visina,
        boja: SNUKER.crvena.b, tip: "crvena", vred: 1 }));
}
const MESTA = {                                 // gde se boje vraćaju na sto
  zuta: () => ({ x: W / 2 + 16.4, y: H * 0.7935 }), zelena: () => ({ x: W / 2 - 16.4, y: H * 0.7935 }),
  braon: () => ({ x: W / 2, y: H * 0.7935 }), plava: () => ({ x: W / 2, y: H / 2 }),
  roze: () => ({ x: W / 2, y: H * 0.255 }), crna: () => ({ x: W / 2, y: H * 0.0908 })
};

/* ================= FIZIKA ================= */
let dogadjaji = null;                           // šta se desilo u ovom udarcu
function miruje() { return lopte.every(b => !b.ziva || (b.vx === 0 && b.vy === 0)); }

function korakFizike(dt) {
  for (const b of lopte) {
    if (!b.ziva) continue;
    if (b.bela && Math.abs(b.sx) > 0.01) {      // bočni felš savija putanju
      const br = Math.hypot(b.vx, b.vy);
      if (br > 6) {
        const a = b.sx * 0.75 * dt, c = Math.cos(a), s = Math.sin(a);
        const nx = b.vx * c - b.vy * s, ny = b.vx * s + b.vy * c;
        b.vx = nx; b.vy = ny;
      }
      b.sx *= Math.pow(0.5, dt);
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    const br = Math.hypot(b.vx, b.vy);
    if (br > 0) {
      const n = br - TRENJE * dt;
      if (n < PRAG) { b.vx = 0; b.vy = 0; b.sx = 0; b.sy = 0; }
      else { b.vx = b.vx / br * n; b.vy = b.vy / br * n; }
    }
  }
  for (let i = 0; i < lopte.length; i++) {
    const a = lopte[i]; if (!a.ziva) continue;
    for (let j = i + 1; j < lopte.length; j++) {
      const b = lopte[j]; if (!b.ziva) continue;
      sudarLopti(a, b);
    }
  }
  for (const b of lopte) {
    if (!b.ziva) continue;
    for (const p of RUPE) {
      if (Math.hypot(b.x - p.x, b.y - p.y) < p.r) {
        b.ziva = false; b.vx = b.vy = 0; b.sx = b.sy = 0;
        if (dogadjaji) dogadjaji.upale.push(b);
        window.SFX && SFX.rupa();
        break;
      }
    }
  }
  for (const b of lopte) { if (!b.ziva) continue; bande(b); for (const c of CELJUSTI) celjust(b, c); }
}
function sudarLopti(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d <= 0 || d >= 2 * R) return;
  const nx = dx / d, ny = dy / d, visak = 2 * R - d;
  a.x -= nx * visak / 2; a.y -= ny * visak / 2;
  b.x += nx * visak / 2; b.y += ny * visak / 2;
  const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny;
  if (va - vb <= 0) return;
  const bl = a.bela ? a : (b.bela ? b : null), meta = a.bela ? b : (b.bela ? a : null);
  let ux = 0, uy = 0, brz = 0;
  if (bl) { brz = Math.hypot(bl.vx, bl.vy); if (brz > 0) { ux = bl.vx / brz; uy = bl.vy / brz; } }

<script>

function fit() {

  const visina = limit - wrap.getBoundingClientRect().top - drugi - razmaci - (parseFloat(cs.paddingBottom) || 0) - 10;
  const sirina = Math.min(window.innerWidth - 16, 460);
  let w = Math.min(sirina, visina * LW / LH);
