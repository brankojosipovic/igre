<style>
  :root {
    color-scheme: dark;
    --bg: #0e1626; --panel: #16223a; --panel-2: #1b2a4a;
    --ink: #eef2f9; --ink-dim: #9fb0cc; --line: #283a5e;
    --gold: #c9a227; --good: #2e9e6b; --bad: #d65a4e;
    --road: #171d29; --lane-line: #3a4664; --booth: #223354;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
    --rows: 13; --chrome: calc(365px + var(--navh, 0px) + var(--sat, 0px));
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f2f4f8; --panel: #ffffff; --panel-2: #eef1f7;
    --ink: #1b2a4a; --ink-dim: #5a6884; --line: #d7dded;
    --gold: #a9851a; --good: #1f7d52; --bad: #c0473c;
    --road: #dde3ee; --lane-line: #aab6cf; --booth: #c7d2e8;
    --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Calibri, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;                  /* prstima sme da se zumira, ali bez dvostrukog tapa */
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  button { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer;
    touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  @media (hover: hover) { button:hover { border-color: var(--gold); } }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px;
          min-height: 100dvh; padding: 8px 10px 10px; }
  .col { width: min(100vw - 20px, 460px); }
  header { display: flex; align-items: center; gap: 10px;
           border-left: 4px solid var(--gold); padding: 4px 0 4px 10px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  header .sub { color: var(--ink-dim); font-size: 13px; }
  .spacer { flex: 1; }

  .bar { display: flex; align-items: center; gap: 8px; }
  .bar .stat { color: var(--ink-dim); font-size: 13px; white-space: nowrap; }
  .bar .stat b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar .mode { font-size: 12px; color: var(--gold); font-weight: 700; }

  .roadWrap { position: relative; background: var(--road); border: 1px solid var(--line);
              border-radius: 12px; padding: 6px; box-shadow: var(--shadow);
              min-height: calc(100dvh - var(--chrome)); }
  .lanes { display: grid; grid-template-columns: repeat(5, 1fr); }
  .lane { position: relative; cursor: pointer; padding: 0 2px; }
  .lane + .lane { border-left: 2px dashed var(--lane-line); }
  .lane .est { text-align: center; font-size: 12px; font-weight: 700; padding: 2px 0;
               color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .lane .est.better { color: var(--good); }
  .lane .est.worse { color: var(--bad); }
  .lane .booth { height: calc(var(--rh) + 6px); display: flex; align-items: center; justify-content: center;
                 gap: 2px; background: var(--booth); border-radius: 8px; margin-bottom: 4px;
                 font-size: calc(var(--rh) * .62); position: relative; }
  .lane .booth .rem { position: absolute; right: 2px; bottom: 1px; font-size: 10px; font-weight: 700;
                      color: var(--ink); background: var(--panel); border-radius: 6px; padding: 0 4px;
                      border: 1px solid var(--line); }
  .lane .booth .insp { position: absolute; left: 2px; top: 1px; font-size: 11px; }
  .lane { --rh: clamp(var(--rhmin, 13px), calc((100dvh - var(--chrome)) / var(--rows)), 31px); }
  .cellrow { height: var(--rh); display: flex; align-items: center; justify-content: center;
             font-size: calc(var(--rh) * .68); line-height: 1; position: relative; }
  .cellrow.player { border-radius: 8px; box-shadow: inset 0 0 0 2px var(--gold);
                    background: color-mix(in srgb, var(--gold) 14%, transparent); }
  .cellrow.ghost { border-radius: 8px; border: 1.5px dashed var(--ink-dim); opacity: .5;
                   font-size: 12.5px; color: var(--ink-dim); }
  .cellrow .more { font-size: 10px; color: var(--ink-dim); font-weight: 700; }
  .lane.you .est { color: var(--gold); }
  .lane.dim { opacity: .55; }

  .ticker { min-height: 20px; font-size: 12px; color: var(--ink-dim); text-align: center;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  .ctrls { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  .ctrls button { padding: 12px 4px; font-weight: 700; }
  .ctrls #wait { border-color: var(--gold); }

  .overlay { position: fixed; inset: 0 0 var(--navh, 0px) 0; display: flex; flex-direction: column; gap: 10px;
             align-items: center; justify-content: center; text-align: center; padding: 18px;
             background: color-mix(in srgb, var(--bg) 94%, transparent);
             backdrop-filter: blur(4px); z-index: 55;
             overflow-y: auto; overscroll-behavior: contain; }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; color: var(--ink-dim); font-size: 13px; max-width: 340px; }
  .overlay .stars { font-size: 26px; letter-spacing: 4px; }
  .overlay .res { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 13px;
                  text-align: left; color: var(--ink-dim); }
  .overlay .res b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .overlay .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .overlay ul { margin: 0; padding-left: 18px; text-align: left; color: var(--ink-dim); font-size: 13px; max-width: 330px; }
  .overlay ul li { margin-bottom: 6px; }

  .foot { color: var(--ink-dim); font-size: 12.5px; line-height: 1.4; text-align: center; }
  .foot a { color: var(--ink-dim); }

  @media (max-height: 700px) { header .sub { display: none; } }
  @media (max-height: 620px) {
    :root { --rhmin: 10px; --chrome: calc(330px + var(--navh, 0px) + var(--sat, 0px)); }
    .wrap { gap: 6px; padding: 6px 10px 8px; }
    header h1 { font-size: 15px; }
    .ctrls button { padding: 9px 4px; font-size: 14px; }
    .lane .est { font-size: 10px; }
    .ticker { min-height: 16px; font-size: 11px; }
  }
  @media (orientation: landscape) and (max-height: 620px) {
    :root { --chrome: calc(268px + var(--navh, 0px) + var(--sat, 0px)); }
    .roadWrap { overflow-y: auto; max-height: calc(100dvh - 176px - var(--navh, 0px) - var(--sat, 0px)); }
    .col { width: min(88vw, 640px); }
    header .sub, .foot { display: none; }
    header { padding: 0 0 0 10px; } header h1 { font-size: 15px; }
    .wrap { gap: 5px; padding: 4px 10px 6px; }
    .ctrls button { padding: 7px 4px; }
  }
</style>

<body data-theme="dark">
<div class="wrap">
  <header class="col">
    <div>
      <h1>Kolona</h1>
      <div class="sub">Izaberi traku, prođi granicu — radi i bez interneta</div>
    </div>
    <div class="spacer"></div>
    <button id="theme" title="Svetla/tamna tema">☀︎ / ☾</button>
  </header>

  <div class="bar col">
    <span class="mode" id="modeLbl"></span>
    <button id="restart" title="Ispočetka">⟲</button>
    <div class="spacer"></div>
    <div class="stat" title="Minuta na granici">⏱ <b id="clock">0</b> min</div>
    <div class="stat" title="Menjanja trake">🔀 <b id="sw">0</b></div>
  </div>

  <div class="roadWrap col">
    <div class="lanes" id="lanes"></div>
    <div class="overlay" id="overlay" hidden></div>
  </div>

  <div class="ticker col" id="ticker">&nbsp;</div>

  <div class="ctrls col">
    <button id="left">⬅ levo</button>
    <button id="wait">⏳ sačekaj minut</button>
    <button id="right">desno ➡</button>
  </div>

  <div class="foot col">
    🚗 1′ · 🚐 2′ · 🚌 3′ · 🚚 4′ · 🔍 pregled +3′. Pređeš li u susednu traku, staješ na njen kraj.
    <br><a href="index.html">🎮 Sve igre</a> · <a href="pomoc.html">❔ Pomoć</a>
  </div>
</div>

<script src="igre.js"></script>
<script>
"use strict";
/* ---------- svet (deterministički po seed-u, ne zavisi od igrača) ---------- */
const SVC = [1, 2, 3, 4], EMO = ["🚗", "🚐", "🚌", "🚚"], PX = [.05, .10, .15, .25], XTRA = 3;
const KEY = "kolona.v1", DKEY = "kolona.daily", THEME_KEY = "sudoku.theme";

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildWorld(seed, T) {
  const rnd = mulberry32(seed);
  const mkVeh = () => { const r = rnd(); const t = r < .55 ? 0 : r < .75 ? 1 : r < .85 ? 2 : 3; return { t, x: rnd() < PX[t] ? XTRA : 0 }; };
  const lanes = [];
  for (let L = 0; L < 5; L++) { const n = 10 + ((rnd() * 4) | 0); const a = []; for (let i = 0; i < n; i++) a.push(mkVeh()); lanes.push(a); }
  const rem = lanes.map(a => a.length ? SVC[a[0].t] + a[0].x : 0);
  const startLane = (rnd() * 5) | 0;
  const tape = [], rems = [], shifted = [], events = [];
  const arrive = (L, v) => { lanes[L].push(v); if (lanes[L].length === 1) rem[L] = SVC[v.t] + v.x; };
  for (let t = 0; t <= T; t++) {
    tape.push(lanes.map(a => a.slice())); rems.push(rem.slice());
    const sh = [false, false, false, false, false];
    for (let L = 0; L < 5; L++) {
      if (!lanes[L].length) continue;
      if (--rem[L] <= 0) {
        lanes[L].shift(); sh[L] = true;
        if (lanes[L].length) { const v = lanes[L][0]; rem[L] = SVC[v.t] + v.x; if (v.x) events.push({ t: t + 1, L, k: "insp" }); }
        else rem[L] = 0;
      }
    }
    if (rnd() < .45) {                                        // novo vozilo staje na najkraću
      let m = 1e9, best = [];
      for (let L = 0; L < 5; L++) { const l = lanes[L].length; if (l < m) { m = l; best = [L]; } else if (l === m) best.push(L); }
      arrive(best[(rnd() * best.length) | 0], mkVeh());
    }
    if (rnd() < .35) {                                        // NPC beži iz najduže u kraću susednu
      let li = 0; for (let L = 1; L < 5; L++) if (lanes[L].length > lanes[li].length) li = L;
      const nb = [li - 1, li + 1].filter(x => x >= 0 && x < 5 && lanes[x].length <= lanes[li].length - 2);
      if (nb.length && lanes[li].length) {
        const to = nb.length === 2 ? (lanes[nb[0]].length <= lanes[nb[1]].length ? nb[0] : nb[1]) : nb[0];
        arrive(to, lanes[li].pop()); events.push({ t: t + 1, L: li, to, k: "merge" });
      }
    }
    shifted.push(sh);
  }
  return { seed, tape, rems, shifted, events, startLane, startRow: tape[0][startLane].length };
}

/* ---------- rešavač: najbolja moguća linija + "da si samo stajao" ---------- */
function solveFrom(W, t0, L0, r0) {
  const T = W.tape.length - 1, INF = 1e9;
  let cur = [INF, INF, INF, INF, INF]; cur[L0] = r0;
  for (let t = t0; t < T - 1; t++) {
    for (let L = 0; L < 5; L++) if (cur[L] === 0) return t + 1;
    const nxt = [INF, INF, INF, INF, INF];
    for (let L = 0; L < 5; L++) {
      if (cur[L] >= INF) continue;
      const stay = cur[L] - (W.shifted[t][L] ? 1 : 0);
      if (stay < nxt[L]) nxt[L] = stay;
      for (const d of [-1, 1]) {
        const M = L + d; if (M < 0 || M > 4) continue;
        const r2 = W.tape[t + 1][M].length;
        if (r2 < nxt[M]) nxt[M] = r2;
      }
    }
    cur = nxt;
  }
  return INF;
}
function noSwitchFrom(W, t0, L0, r0) {
  let r = r0;
  for (let t = t0; t < W.tape.length - 1; t++) {
    if (r === 0) return t + 1;
    if (W.shifted[t][L0]) r--;
  }
  return 1e9;
}

/* ---------- stanje partije ---------- */
let W = null, ST = null;   // ST = {mode, seed, t, L, row, sw, done, minutes}
let msg = "";

const $ = s => document.querySelector(s);
const lanesEl = $("#lanes"), overlay = $("#overlay");

function dayNum() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function dayLabel() { const d = new Date(); return d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear() + "."; }

function newRun(mode, seed) {
  W = buildWorld(seed, 320);
  ST = { mode, seed, t: 0, L: W.startLane, row: W.startRow, sw: 0, done: false, minutes: 0 };
  window.SFX && SFX.engine();
  msg = "Tapni ⏳ ili susednu traku. Rampa je gore.";
  hideOverlay(); render(); save();
}

function extendIfNeeded() {
  if (ST.t < W.tape.length - 4) return;
  const T2 = W.tape.length + 160;
  W = buildWorld(ST.seed, T2);                 // isti seed → isti prefiks
}

function doAct(d) {                            // d: -1 levo, 0 čekaj, 1 desno
  if (!ST || ST.done) return;
  extendIfNeeded();
  const t = ST.t;
  if (d !== 0) {
    const M = ST.L + d; if (M < 0 || M > 4) return;
    ST.L = M; ST.row = W.tape[t + 1][M].length; ST.sw++;
    window.SFX && SFX.whoosh();
    msg = "Prešao si u traku " + (M + 1) + " — na kraj njene kolone.";
  } else {
    if (W.shifted[t][ST.L]) { ST.row = Math.max(0, ST.row - 1); window.SFX && SFX.tick(); }
  }
  ST.t = t + 1;
  for (const e of W.events) if (e.t === ST.t) {
    if (e.k === "insp") { msg = "🔍 Traka " + (e.L + 1) + ": detaljan pregled (+3 min)."; window.SFX && SFX.bad(); }
    else if (e.k === "merge" && d === 0) msg = "Neko je pobegao iz trake " + (e.L + 1) + " u traku " + (e.to + 1) + ".";
  }
  if (ST.row === 0) { ST.done = true; ST.minutes = ST.t + 1; window.SFX && (SFX.stamp(), setTimeout(SFX.win, 260)); finish(); }
  render(); save();
}

function finish() {
  const opt = solveFrom(W, 0, W.startLane, W.startRow);
  const ns = noSwitchFrom(W, 0, W.startLane, W.startRow);
  const m = ST.minutes;
  const stars = m <= opt + 1 ? 3 : m <= opt + 4 ? 2 : m < ns ? 1 : 0;
  window.TOP && window.TOP.upisi("kolona", ST.mode === "daily" ? "dnevna" : "slobodna", m,
    "⭐".repeat(stars) || "🐢");
  if (ST.mode === "daily") {
    try {
      const all = JSON.parse(localStorage.getItem(DKEY) || "{}");
      const prev = all[String(dayNum())];
      if (!prev || m < prev.m) all[String(dayNum())] = { m, stars, sw: ST.sw };
      localStorage.setItem(DKEY, JSON.stringify(all));
    } catch (e) { }
  }
  const shareTxt = "Kolona 🚧 " + (ST.mode === "daily" ? dayLabel() : "slobodna") + " — " + m + " min " +
    "⭐".repeat(stars || 0) + (stars ? "" : "🐢") + " (najbolje " + opt + ", bez menjanja " + ns + ", 🔀" + ST.sw + ")";
  overlay.innerHTML =
    '<h2>🛂 Pečat! Prošao si granicu</h2>' +
    '<div class="stars">' + ("⭐".repeat(stars) || "🐢") + '</div>' +
    '<div class="res">' +
    '<span>Tvoje vreme</span><b>' + m + ' min</b>' +
    '<span>Savršena linija (sveznajuća)</span><b>' + opt + ' min</b>' +
    '<span>Da si samo stajao</span><b>' + ns + ' min</b>' +
    '<span>Menjanja trake</span><b>' + ST.sw + '</b>' +
    '</div>' +
    '<p>' + (m < ns ? "Menjanje se isplatilo: ušteda " + (ns - m) + " min." :
      m === ns ? "Tačno kao da si stajao u mestu. Zen." :
        "Ovaj put bi mirovanje bilo brže za " + (m - ns) + " min. Dešava se i najboljima.") + '</p>' +
    '<div class="btns"><button id="shareBtn">📋 Podeli</button>' +
    '<button id="againBtn">' + (ST.mode === "daily" ? "🎲 Slobodna igra" : "🎲 Nova kolona") + '</button>' +
    (ST.mode === "daily" ? '<button id="retryBtn">⟲ Današnja ponovo</button>' : '') +
    '</div>';
  overlay.hidden = false;
  $("#shareBtn").onclick = () => {
    const done = () => { $("#shareBtn").textContent = "✔ Kopirano"; };
    try { navigator.clipboard.writeText(shareTxt).then(done, () => prompt("Kopiraj:", shareTxt)); }
    catch (e) { prompt("Kopiraj:", shareTxt); }
  };
  $("#againBtn").onclick = () => newRun("free", (Math.random() * 2 ** 31) | 0);
  const rb = $("#retryBtn"); if (rb) rb.onclick = () => newRun("daily", dayNum());
}

function showIntro() {
  let dtxt = "";
  try {
    const all = JSON.parse(localStorage.getItem(DKEY) || "{}");
    const d = all[String(dayNum())];
    if (d) dtxt = '<p>Današnja ti je već prošla: <b style="color:var(--ink)">' + d.m + ' min ' + "⭐".repeat(d.stars) + '</b></p>';
  } catch (e) { }
  overlay.innerHTML =
    '<h2>🚧 Kolona</h2>' +
    '<ul>' +
    '<li>Svaki tap je <b>1 minut</b>. Rampa obrađuje: 🚗 1′ · 🚐 2′ · 🚌 3′ · 🚚 4′, 🔍 pregled +3′.</li>' +
    '<li>Možeš u <b>susednu</b> traku — ali staješ <b>na njen kraj</b>.</li>' +
    '<li>I drugi menjaju trake. Proceni, rizikuj, prođi što pre.</li>' +
    '</ul>' + dtxt +
    '<div class="btns"><button id="dailyBtn">📅 Dnevna kolona</button><button id="freeBtn">🎲 Slobodna igra</button></div>';
  overlay.hidden = false;
  $("#dailyBtn").onclick = () => newRun("daily", dayNum());
  $("#freeBtn").onclick = () => newRun("free", (Math.random() * 2 ** 31) | 0);
}
function hideOverlay() { overlay.hidden = true; }

/* ---------- render ---------- */
function estimate(q, rem, upto) {
  let s = 0;
  for (let i = 0; i < Math.min(q.length, upto); i++) s += i === 0 ? rem : SVC[q[i].t];
  return s;
}

function render() {
  if (!ST) return;
  const t = ST.t, snap = W.tape[t], rems = W.rems[t];
  const myEst = estimate(snap[ST.L], rems[ST.L], ST.row);
  let need = ST.row + 1;
  for (let L = 0; L < 5; L++) need = Math.max(need, snap[L].length + (Math.abs(L - ST.L) === 1 ? 1 : 0));
  const rows = Math.max(8, Math.min(18, need + 1));
  document.documentElement.style.setProperty("--rows", rows);
  queueMicrotask(() => { const pe = lanesEl.querySelector(".cellrow.player");
    if (pe && $(".roadWrap").scrollHeight > $(".roadWrap").clientHeight + 2) pe.scrollIntoView({ block: "center" }); });

  let h = "";
  for (let L = 0; L < 5; L++) {
    const q = snap[L], adj = Math.abs(L - ST.L) === 1, mine = L === ST.L;
    const est = mine ? myEst : estimate(q, rems[L], q.length);
    const cls = mine ? "lane you" : adj ? "lane" : "lane dim";
    const estCls = mine ? "est" : est < myEst - 2 ? "est better" : est > myEst + 2 ? "est worse" : "est";
    h += '<div class="' + cls + '" data-l="' + L + '">';
    h += '<div class="' + estCls + '">' + (mine ? "TI · " : "") + "~" + est + "′</div>";
    const front = q[0];
    h += '<div class="booth">🛂' + (front ? EMO[front.t] : "") +
      (front ? '<span class="rem">' + rems[L] + '′</span>' : "") +
      (front && front.x && rems[L] > SVC[front.t] ? '<span class="insp">🔍</span>' : "") + "</div>";
    for (let r = 1; r < rows; r++) {
      let inner = "", rcls = "cellrow";
      if (mine && r === ST.row) { inner = "🚘"; rcls += " player"; }
      else {
        let qi = r; if (mine && r > ST.row) qi = r - 1;                 // iza tebe
        if (qi < q.length) {
          if (r === rows - 1 && q.length > qi + 1) inner = '<span class="more">+' + (q.length - qi) + '</span>';
          else inner = EMO[q[qi].t];
        } else if (adj && !ST.done && r === q.length) { inner = "↩ tu"; rcls += " ghost"; }
      }
      h += '<div class="' + rcls + '">' + inner + "</div>";
    }
    h += "</div>";
  }
  lanesEl.innerHTML = h;
  $("#clock").textContent = ST.done ? ST.minutes : ST.t;
  $("#sw").textContent = ST.sw;
  $("#modeLbl").textContent = ST.mode === "daily" ? "📅 " + dayLabel() : "🎲 slobodna";
  $("#ticker").textContent = msg || " ";
  $("#left").disabled = ST.done || ST.L === 0;
  $("#right").disabled = ST.done || ST.L === 4;
  $("#wait").disabled = ST.done;
}

/* ---------- čuvanje ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify({ mode: ST.mode, seed: ST.seed, t: ST.t, L: ST.L, row: ST.row, sw: ST.sw, done: ST.done, minutes: ST.minutes })); } catch (e) { } }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!s || typeof s.seed !== "number" || s.done) return false;
    if (s.mode === "daily" && s.seed !== dayNum()) return false;       // stara dnevna — odbaci
    W = buildWorld(s.seed, Math.max(320, s.t + 160));
    ST = s; msg = "Nastavljaš gde si stao.";
    render();
    return true;
  } catch (e) { return false; }
}

/* ---------- ulaz ---------- */
lanesEl.addEventListener("click", e => {
  if (!ST || ST.done || !overlay.hidden) return;
  const ln = e.target.closest(".lane"); if (!ln) return;
  const L = +ln.dataset.l;
  if (L === ST.L) doAct(0);
  else if (Math.abs(L - ST.L) === 1) doAct(L - ST.L);
});
$("#wait").onclick = () => doAct(0);
$("#left").onclick = () => doAct(-1);
$("#right").onclick = () => doAct(1);
$("#restart").onclick = () => { if (!ST || ST.done || ST.t === 0 || confirm("Ispočetka?")) showIntro(); };
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) { }
};
document.addEventListener("keydown", e => {
  if (!ST || !overlay.hidden) return;
  if (e.key === "ArrowLeft") { doAct(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { doAct(1); e.preventDefault(); }
  if (e.key === " " || e.key === "ArrowDown" || e.key === "ArrowUp") { doAct(0); e.preventDefault(); }
});
window.addEventListener("pagehide", save);

/* ---------- start ---------- */
try { const th = localStorage.getItem(THEME_KEY); if (th) document.body.dataset.theme = th; } catch (e) { }
if (!load()) showIntro();

/* za testove */
window.G = { get W() { return W; }, get ST() { return ST; }, buildWorld, solveFrom, noSwitchFrom, doAct, newRun };
</script>
</body>
