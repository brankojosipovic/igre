  :root {

  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Calibri, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;                  /* prstima sme da se zumira, ali bez dvostrukog tapa */
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  button { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; cursor: pointer;
    touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  @media (hover: hover) { button:hover { border-color: var(--gold); } }
  input { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);

          letter-spacing: 3px; text-transform: uppercase; }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 7px;
          min-height: 100dvh; padding: 6px 10px 8px; }
  .col { width: min(100vw - 20px, calc(460px * var(--sirenje, 1))); }
  header { display: flex; align-items: center; gap: 10px;
           border-left: 4px solid var(--gold); padding: 3px 0 3px 10px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  header .sub { color: var(--ink-dim); font-size: 13px; }
  .spacer { flex: 1; }

  .hud { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); flex-wrap: wrap; }
  .hud .ko { padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
  .hud .ko.on { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .hud b { color: var(--ink); font-weight: 700; }
  .kodBtn { font: inherit; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
            background: var(--panel-2); border: 1px solid var(--gold); color: var(--ink-dim); white-space: nowrap; }
  .kodBtn b { letter-spacing: 2px; color: var(--gold); }

  .sto { background: var(--felt); border: 1px solid var(--line); border-radius: 12px;
         padding: 8px; box-shadow: var(--shadow); min-height: calc(var(--cw) * 1.5 + 30px); }
  .sto .lb { font-size: 12.5px; color: rgba(238,242,249,.55); margin-bottom: 4px; }
  [data-theme="light"] .sto .lb { color: rgba(27,42,74,.5); }
  .red { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; min-height: calc(var(--cw) * 1.5); }

  .karta { width: var(--cw); height: calc(var(--cw) * 1.5); border-radius: 7px; background: var(--face);
           color: var(--face-ink); position: relative; flex: 0 0 auto; cursor: pointer;
           box-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.15); }
  .karta.crvena { color: var(--red); }
  /* Lice karte crta KARTE iz igre.js — isto za soliter, tablić i aparat. */
  .karta { --kw: var(--cw); }
  .karta.izabrana { outline: 2px solid var(--gold); outline-offset: -2px; transform: translateY(-5px); }
  .karta.meta { outline: 2px solid var(--good); outline-offset: -2px; }
  .karta.pozadi { background: repeating-linear-gradient(45deg, #26406e 0 4px, #16223a 4px 8px);
                  box-shadow: inset 0 0 0 2px var(--face); }
  .karta.pozadi > * { display: none; }

  .ulovi { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .ulovi button { padding: 7px 10px; font-size: 13px; }
  .ulovi button.dobar { border-color: var(--good); color: var(--good); }

  .msg { text-align: center; font-size: 13px; color: var(--ink-dim); min-height: 20px; }
  .msg b { color: var(--ink); }

  .overlay { position: fixed; inset: 0 0 var(--navh, 0px) 0; display: flex; flex-direction: column; gap: 10px;
             align-items: center; justify-content: center; text-align: center; padding: 18px;
             background: color-mix(in srgb, var(--bg) 95%, transparent); backdrop-filter: blur(4px);
             z-index: 55; overflow-y: auto; overscroll-behavior: contain; }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p, .overlay ul { margin: 0; font-size: 13px; color: var(--ink-dim); max-width: 330px; }
  .overlay ul { padding-left: 18px; text-align: left; }
  .overlay ul li { margin-bottom: 5px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btns button { min-width: 130px; }
  .kodBox { font-size: 30px; font-weight: 700; letter-spacing: 8px; color: var(--gold);
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; }
  .rez { display: grid; grid-template-columns: auto auto auto; gap: 2px 14px; font-size: 13px; color: var(--ink-dim); }
  .hud.puno .ko { font-size: 11.5px; padding: 2px 6px; }
  #protivnik .pro { display: inline-flex; align-items: center; gap: 5px; font-size: 13px;
                    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
                    padding: 4px 10px; margin: 0 4px 4px 0; color: var(--ink-dim); }
  #protivnik .pro.on { border-color: var(--gold); color: var(--ink); }
  #protivnik .pro b { color: var(--ink); }
  .mesta { display: flex; flex-direction: column; gap: 4px; width: min(100%, 300px); font-size: 14.5px; }
  .mesta .mesto { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                  padding: 6px 10px; text-align: left; }
  .mesta .mesto.prazno { color: var(--ink-dim); border-style: dashed; }
  .rez b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .foot { color: var(--ink-dim); font-size: 12.5px; line-height: 1.4; text-align: center; }
  .foot a { color: var(--ink-dim); }
  @media (max-height: 780px) { .foot { display: none; } }
  @media (max-height: 680px) { header .sub { display: none; } }
  @media (max-height: 620px) { header h1 { font-size: 15px; } .wrap { gap: 5px; } }
  @media (orientation: landscape) and (max-height: 520px) {
    header .sub, .foot { display: none; }
    header { padding: 0 0 0 10px; } header h1 { font-size: 15px; }
    .wrap { gap: 4px; padding: 3px 10px 5px; }
    .sto { padding: 5px; }
  }
</style>

<div class="wrap">

  <div class="hud col" id="hud"></div>
  <div class="col" id="proWrap"><div class="sto" style="background:transparent;border:0;box-shadow:none;padding:0;min-height:0">
    <div class="lb" id="proLb"></div><div class="red" id="protivnik"></div></div></div>
  <div class="col sto"><div class="lb" id="stoLb">Sto</div><div class="red" id="sto"></div></div>
  <div class="ulovi col" id="ulovi"></div>
  <div class="col"><div class="lb" style="font-size:12.5px;color:var(--ink-dim);margin-bottom:4px" id="rukaLb">Tvoje karte</div>
    <div class="red" id="ruka"></div></div>

  <div class="foot col">

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "tablic.v1";
const ZNAK = ["♠", "♥", "♦", "♣"], IME = { 1: "A", 11: "J", 12: "Q", 13: "K" };
const crvena = s => s === 1 || s === 2;
const ime = c => (IME[c.r] || c.r) + ZNAK[c.s];
const vred = c => c.r === 12 ? 13 : c.r === 13 ? 14 : c.r === 11 ? 12 : c.r;
                                                         // A=1 … 10=10, J=12 (kupi sve), Q=13, K=14
const zbirljiva = c => c.r <= 10;                        // u zbir ulaze samo A–10, ne i figure
/* Kec vredi 1 ili 11 — i kad se igra iz ruke, i kad leži na stolu u zbiru. */
const vrednosti = c => c.r === 1 ? [1, 11] : [vred(c)];

/* ---------- špil ---------- */
function spil() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[d[i], d[j]] = [d[j], d[i]]; }
  return d;
}

/* ---------- mogući ulovi ---------- */
function ulovi(karta, sto, sve) {
  const out = [];
  const kupiSve = sve === undefined ? zandarSve : sve;
  if (karta.r === 11 && kupiSve) {                        // pravilo kuće: žandar čisti sto
    if (sto.length) out.push({ karte: sto.slice(), opis: "sve sa stola", zandar: true });
    return out;
  }
  const ciljevi = vrednosti(karta);                       // kec gađa i 1 i 11
  for (let i = 0; i < sto.length; i++)
    if (vrednosti(sto[i]).some(v => ciljevi.indexOf(v) >= 0))
      out.push({ karte: [sto[i]], opis: ime(sto[i]) });
  {                                                      // zbir važi i za damu (13) i kralja (14)
    const kand = sto.map((c, i) => ({ c, i })).filter(x => zbirljiva(x.c));
    const n = kand.length;
    for (let mask = 1; mask < (1 << n); mask++) {
      let osnov = 0, asova = 0, izbor = [];
      for (let b = 0; b < n; b++) if (mask & (1 << b)) {
        const c = kand[b].c;
        izbor.push(c);
        if (c.r === 1) { asova++; osnov += 1; } else osnov += vred(c);
      }
      if (izbor.length < 2) continue;
      for (let k = 0; k <= asova; k++) {                 // svaki kec sa stola sme da bude i 11
        if (ciljevi.indexOf(osnov + 10 * k) < 0) continue;
        out.push({ karte: izbor, opis: izbor.map(ime).join(" + ") });
        break;
      }
    }
  }
  const vidjeno = new Set();
  return out.filter(u => {
    const k = u.karte.map(c => c.r + "-" + c.s).sort().join(",");
    if (vidjeno.has(k)) return false; vidjeno.add(k); return true;
  }).sort((a, b) => b.karte.length - a.karte.length);
}

/* ---------- bodovanje ---------- */
function poeni(karte) {
  let p = 0;
  for (const c of karte) {
    if (c.r === 1) p += 1;                               // asovi
    else if (c.r === 10) p += (c.s === 2 ? 2 : 1);       // desetke; 10♦ vredi 2
    else if (c.r === 2 && c.s === 3) p += 1;             // 2♣
  }
  return p;
}

/* ---------- stanje ---------- */
let G = null, izabrana = -1, mojIndex = 0;
let postava = null, cekaonica = false;         // postava: [{id, ime}] — ko sedi na kom mestu
/* Gost prvo dobije postavu, pa tek onda karte. Ekran sa kodom se sklanja kad
   stignu karte — da ne ostane preko stola. Kasnije poruke o stanju ne diraju
   prozor, jer neko možda baš gleda meni sobe. */
let cekamPrvoStanje = false;
let zandarSve = false;                                   // pravilo kuće: podrazumevano žandar vredi 12
try { zandarSve = JSON.parse(localStorage.getItem("tablic.zandar") || "false"); } catch (e) { }
function postaviZandara(v) { zandarSve = !!v; try { localStorage.setItem("tablic.zandar", JSON.stringify(zandarSve)); } catch (e) { } }
/* G = {rezim, spil, sto, ruke:[[]…], kupio:[[]…], table:[0…], naRedu, poslednji, imena, gotovo, deljenje}
   Igrača ume da bude dvoje, troje ili četvoro — sve niz-po-igraču. */
const brojIgraca = () => (G && G.ruke) ? G.ruke.length : 2;

function novaIgra(rezim, imena, seedStanje) {
  if (seedStanje) { G = seedStanje; }
  else {
    const im = (imena && imena.length >= 2 ? imena : ["Ti", "Računar"]).slice(0, 4);
    const n = im.length;
    const d = spil();
    G = {
      rezim, imena: im,
      spil: d, sto: [],
      ruke: im.map(() => []), kupio: im.map(() => []), table: im.map(() => 0),
      naRedu: 0, poslednji: 0, gotovo: false, deljenje: 0, zandarSve
    };
    for (let i = 0; i < 4; i++) G.sto.push(G.spil.pop());
    podeli();
  }
  izabrana = -1; hideOverlay(); render(); save();
  if (G.rezim === "mreza" && Mreza.uloga() === "domacin") posaljiStanje();
  mozdaRacunar();
}
function podeli() {
  G.deljenje++;
  for (let i = 0; i < 6; i++) for (const r of G.ruke) if (G.spil.length) r.push(G.spil.pop());
}
let sacuvanaMreza = null;                              // {kod, uloga, mojIndex} prekinute mrežne partije
let nastavljam = false;                                // nastavljamo staru partiju, ne pravimo novu
function save() {
  if (!G) return;
  try {
    const m = (G.rezim === "mreza" && window.Mreza && Mreza.kod())
      ? { kod: Mreza.kod(), uloga: Mreza.uloga(), mojIndex: mojIndex, postava: postava }
      : (G.rezim === "mreza" ? sacuvanaMreza : null);
    localStorage.setItem(KEY, JSON.stringify({ g: G, mreza: m }));
  } catch (e) { }
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw) return false;
    const g = raw.spil ? raw : raw.g;                    // stariji zapis je bio samo partija
    if (!g || !g.ruke || g.gotovo) return false;
    G = g;
    sacuvanaMreza = raw.spil ? null : (raw.mreza || null);
    if (G.rezim === "mreza" && !sacuvanaMreza) G.rezim = "dvoje";   // bez koda nema šta da se nastavi
    mojIndex = sacuvanaMreza ? (sacuvanaMreza.mojIndex || 0) : 0;
    postava = (sacuvanaMreza && sacuvanaMreza.postava) || null;
    return true;
  } catch (e) { return false; }
}
const mojRed = () => G.rezim === "mreza" ? G.naRedu === mojIndex : (G.rezim === "sam" ? G.naRedu === 0 : true);
const imeIgraca = i => (G && G.imena && G.imena[i]) || ("Igrač " + (i + 1));

/* ---------- potez ---------- */
function odigraj(igracIdx, kartaIdx, ulovIdx) {
  const ruka = G.ruke[igracIdx];
  const karta = ruka[kartaIdx];
  if (!karta) return false;
  const opcije = ulovi(karta, G.sto);
  if (ulovIdx == null || ulovIdx < 0 || !opcije[ulovIdx]) {
    ruka.splice(kartaIdx, 1);
    G.sto.push(karta);
    window.SFX && SFX.card();
  } else {
    const u = opcije[ulovIdx];
    ruka.splice(kartaIdx, 1);
    const uzeto = u.karte;
    G.sto = G.sto.filter(c => !uzeto.includes(c));
    G.kupio[igracIdx].push(karta, ...uzeto);
    G.poslednji = igracIdx;
    if (G.sto.length === 0 && !u.zandar) { G.table[igracIdx]++; window.SFX && SFX.jackpot(); }
    else window.SFX && SFX.coin();
  }
  izabrana = -1;
  if (G.ruke.every(r => r.length === 0)) {
    if (G.spil.length) podeli();
    else return zavrsi();
  }
  G.naRedu = (G.naRedu + 1) % brojIgraca();
  render(); save(); posaljiStanje();
  mozdaRacunar();
  return true;
}
function zavrsi() {
  for (const c of G.sto) G.kupio[G.poslednji].push(c);
  G.sto = [];
  G.gotovo = true;
  const n = brojIgraca();
  const p = G.ruke.map((_, i) => {
    const osn = poeni(G.kupio[i]);
    return { i, ime: imeIgraca(i), karte: G.kupio[i].length, osn, table: G.table[i] };
  });
  /* Tri poena za najviše karata dobija samo onaj ko ih ima sam — kad je izjednačeno,
     tri poena propadaju, isto kao i u dvoje. */
  const najKarata = Math.max.apply(null, p.map(x => x.karte));
  const sNaj = p.filter(x => x.karte === najKarata);
  const vise = sNaj.length === 1 ? sNaj[0].i : -1;
  p.forEach(x => x.ukupno = x.osn + x.table + (x.i === vise ? 3 : 0));
  G.rezultat = { p, vise };
  render(); save(); posaljiStanje();
  const najUk = Math.max.apply(null, p.map(x => x.ukupno));
  const prvi = p.filter(x => x.ukupno === najUk);
  if (window.TOP && G.rezim !== "dvoje" && p[mojIndex])
    window.TOP.upisi("tablic", "poeni", p[mojIndex].ukupno, p[mojIndex].karte + " karata");
  window.SFX && SFX.win();
  const red = ['<span></span>' + p.map(x => '<b>' + x.ime + '</b>').join("")] .concat([
    '<span>Asovi, desetke, 2♣</span>' + p.map(x => '<b>' + x.osn + '</b>').join(""),
    '<span>Table</span>' + p.map(x => '<b>' + x.table + '</b>').join(""),
    '<span>Više karata (+3)</span>' + p.map(x => '<b>' + (x.i === vise ? 3 : 0) + '</b>').join(""),
    '<span>Karata</span>' + p.map(x => '<b>' + x.karte + '</b>').join(""),
    '<span><b>Ukupno</b></span>' + p.map(x => '<b>' + x.ukupno + '</b>').join("")
  ]).join("");
  showOverlay('<h2>' + (prvi.length > 1
      ? "Nerešeno — " + prvi.map(x => x.ime).join(" i ")
      : "🏆 " + prvi[0].ime + " pobeđuje") + '</h2>' +
    '<div class="rez" style="grid-template-columns:1fr' + " repeat(" + n + ",auto)" + '">' + red + '</div>' +
    '<div class="btns"><button id="opetBtn">⟲ Još jednom</button><button id="meniBtn3">📋 Meni</button></div>');
  $("#opetBtn").onclick = () => (G.rezim === "mreza" ? kreniPartiju() : novaIgra(G.rezim, G.imena));
  $("#meniBtn3").onclick = meni;
  try { localStorage.removeItem(KEY); } catch (e) { }
  return true;
}

/* ---------- računar ---------- */
function mozdaRacunar() {
  if (!G || G.gotovo || G.rezim !== "sam" || G.naRedu !== 1) return;
  setTimeout(() => {
    if (!G || G.gotovo || G.naRedu !== 1) return;
    const p = potezRacunara();
    odigraj(1, p.karta, p.ulov);
  }, 750);
}
function potezRacunara() {
  const ruka = G.ruke[1];
  let naj = { ocena: -1e9, karta: 0, ulov: -1 };
  for (let i = 0; i < ruka.length; i++) {
    const opc = ulovi(ruka[i], G.sto);
    for (let j = 0; j < opc.length; j++) {
      const u = opc[j];
      const tabla = G.sto.length === u.karte.length && !u.zandar;
      const oc = poeni([ruka[i], ...u.karte]) * 10 + (u.karte.length + 1) * 2 + (tabla ? 25 : 0) - (ruka[i].r === 11 ? 6 : 0);
      if (oc > naj.ocena) naj = { ocena: oc, karta: i, ulov: j };
    }
  }
  if (naj.ocena > -1e8) return naj;
  let najgora = 0, oc = 1e9;                               // ništa se ne kupi: baci najbezopasniju
  for (let i = 0; i < ruka.length; i++) {

function fit() {
  const wrap = document.querySelector(".wrap"), nav = document.querySelector(".gamenav");
  const limit = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  const kids = [...wrap.children].filter(el => el.offsetParent !== null);
  if (!kids.length) return;
  const bottom = Math.max(...kids.map(el => el.getBoundingClientRect().bottom));
  let cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cw")) || 46;
  if (bottom > limit - 4 && cw > 26) {
    document.documentElement.style.setProperty("--cw", Math.max(26, cw - Math.ceil((bottom - limit + 8) / 6)) + "px");
  } else if (bottom < limit - 70 && cw < 52) {
    document.documentElement.style.setProperty("--cw", Math.min(52, cw + 2) + "px");
  }
}

  if (typeof unapred === "string") $("#kodIn").value = unapred;
  $("#idiBtn").onclick = () => {
    const k = $("#kodIn").value.trim(); if (k.length < 4) return;
    pridruziSe(k.toUpperCase(), false);
  };
  setTimeout(() => { const i = $("#kodIn"); if (i) i.focus(); }, 100);
}
function pridruziSe(k, nastavakStare) {
  nastavljam = !!nastavakStare;
  ponoviVezu = () => pridruziSe(k, nastavakStare);
  showOverlay('<h2>Spajam se…</h2><p>' + (nastavakStare ? "Vraćam se u sobu" : "Tražim sobu") +
    ' <b style="color:var(--gold)">' + k + '</b></p>');
  mojIndex = 1;
  Mreza.pridruzi(k, { poruka: primi, status: statusMreze }).catch(() => { });
}
function showOverlay(h) { const o = $("#overlay"); o.innerHTML = h; o.hidden = false; }
function hideOverlay() { $("#overlay").hidden = true; }
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("sudoku.theme", b.dataset.theme); } catch (e) { }
};

/* ---------- start ---------- */
try { const t = localStorage.getItem("sudoku.theme"); if (t) document.body.dataset.theme = t; } catch (e) { }
if (load()) { render(); if (sacuvanaMreza) meni(); else mozdaRacunar(); }
else { novaIgra("sam", ["Ti", "Računar"]); meni(); }

window.T = {
  get G() { return G; }, ulovi, poeni, vred, vrednosti, ime, spil, odigraj, novaIgra, potezRacunara, render, zavrsi,
  get zandarSve() { return zandarSve; }, postaviZandara,
  primi, statusMreze, posaljiStanje,
  poveziLokalno: u => { mojIndex = u === "gost" ? 1 : 0; return Mreza.lokalno("tablic-test", { uloga: u, poruka: primi, status: statusMreze }); },
  get mojIndex() { return mojIndex; },
  save, load, meni, meniSobe, nastaviPartiju, vratiUIgru, uSobi, sedim,
  brojIgraca, imeIgraca, kreniPartiju, osveziPostavu, primiPostavu, pokaziKod,
  get postava() { return postava; },
  get sacuvanaMreza() { return sacuvanaMreza; },
  setSto: a => { G.sto = a; render(); }, setRuka: (i, a) => { G.ruke[i] = a; render(); },
  setSpil: a => { G.spil = a; }, izaberi: i => { izabrana = i; render(); }
};
</script>
