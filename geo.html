  const qi = G.red[G.k], q = PIT[qi], map = raspored(G.seed, qi);
  const tacnaPoz = map.indexOf(0);
  $("#pit").innerHTML = '<div class="br">Pitanje ' + (G.k + 1) + " / " + G.red.length + '</div>' +
    '<div class="tx">' + q[0] + '</div>';

  const otkrij = G.faza !== "pitanje";
  $("#odg").innerHTML = map.map((orig, poz) => {
    const ko = [];
    for (let i = 0; i < n; i++) if (G.izbor[i] === poz) ko.push(i);
    let cls = "";
    if (otkrij) {
      if (poz === tacnaPoz) cls = " tacno";
      else if (ko.length) cls = " netacno";
    }
    if (mojIzbor === poz || (otkrij && G.izbor[mojIndex] === poz)) cls += " moj";
    const pr = otkrij && vise
      ? ko.map(i => i === mojIndex ? "ti" : imeIgraca(i)).join(", ")
      : "";
    return '<button class="' + cls.trim() + '" data-p="' + poz + '"' + (otkrij || mojIzbor != null ? " disabled" : "") + '>' +
      '<span class="sl">' + "ABCD"[poz] + '</span><span>' + q[1 + orig] + '</span>' +
      (pr ? '<span class="pr">' + pr + '</span>' : '') + '</button>';
  }).join("");
  for (const b of document.querySelectorAll("#odg button")) b.onclick = () => odgovori_klik(+b.dataset.p);

  if (G.faza === "pitanje") {
    if (G.k !== zadnjiK) { zadnjiK = G.k; tPrikaz = performance.now(); pokreniTraku(); }
    const koliko = javili.slice(0, n).filter(Boolean).length;
    poruka(mojIzbor != null
      ? "Odgovor poslat — čekam… <b>" + koliko + "/" + n + "</b>"
      : (vise ? "Ko prvi pogodi, nosi <b>+3</b>." + (koliko ? ' <b>' + koliko + "/" + n + "</b> odgovorilo" : "")
              : "Tačno <b>+3</b>, promašaj <b>−1</b>."));
  } else if (G.faza === "otkrij") {
    zadnjiK = -1; stopTraka();
    const mojaTacna = G.izbor[mojIndex] === tacnaPoz;
    let t;
    if (G.brzi == null) t = "Niko nije pogodio — tačno je <b>" + q[1] + "</b>.";
    else if (G.brzi === mojIndex) t = "✔ Ti si bio najbrži! <b>+3</b>" + (G.vreme[mojIndex] != null ? " (" + (G.vreme[mojIndex] / 1000).toFixed(1) + " s)" : "");
    else t = (mojaTacna ? "Tačno, ali sporije — <b>+1</b>." : imeIgraca(G.brzi) + " je bio najbrži.") +
             (G.vreme[G.brzi] != null ? " (" + (G.vreme[G.brzi] / 1000).toFixed(1) + " s)" : "");
    const o = objasnjenje(q);
    poruka(t + (o ? '<span class="obj">ℹ️ ' + o + '</span>' : ""));
  }
  fit();
}
function poruka(h) { $("#msg").innerHTML = h; }

/* ---------- traka vremena ---------- */
function pokreniTraku() {
  clearInterval(tikTajmer);
  const bar = $("#traka");
  tikTajmer = setInterval(() => {
    if (!G || G.faza !== "pitanje") return stopTraka();
    const p = Math.max(0, 1 - (performance.now() - tPrikaz) / ROK);
    bar.firstElementChild.style.width = (p * 100).toFixed(1) + "%";
    bar.classList.toggle("malo", p < 0.28);
  }, 100);
}
function stopTraka() {
  clearInterval(tikTajmer); tikTajmer = null;
  const bar = $("#traka");
  bar.firstElementChild.style.width = "100%"; bar.classList.remove("malo");
}

/* ---------- uklapanje u jedan ekran ---------- */
function fit() {
  const wrap = document.querySelector(".wrap"), nav = document.querySelector(".gamenav");
  if (!wrap) return;
  const root = document.documentElement, limit = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  const stanje = [
    { pf: 17, of: 15, op: 10, og: 8, ph: 96 },
    { pf: 16, of: 14, op: 9, og: 7, ph: 86 },
    { pf: 15, of: 13.5, op: 8, og: 6, ph: 76 },
    { pf: 14, of: 13, op: 7, og: 5, ph: 66 },
    { pf: 13, of: 12, op: 6, og: 4, ph: 58 }
  ];
  for (let i = 0; i < stanje.length; i++) {
    const s = stanje[i];
    root.style.setProperty("--pf", s.pf + "px"); root.style.setProperty("--of", s.of + "px");
    root.style.setProperty("--op", s.op + "px"); root.style.setProperty("--og", s.og + "px");
    root.style.setProperty("--ph", s.ph + "px");
    const dno = wrap.getBoundingClientRect().bottom;
    if (dno <= limit - 2) return;
  }
}
window.addEventListener("resize", fit);
window.addEventListener("load", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 120));

/* ---------- meni ---------- */
function meni() {
  if (uSobi()) return meniSobe();
  ocistiTajmere(); stopTraka(); cekaonica = false;
  const nast = G && !G.gotovo && G.red && (sacuvanaMreza || G.rezim !== "mreza");
  const opis = sacuvanaMreza ? " (" + sacuvanaMreza.kod + ")" : " — pitanje " + (G && G.red ? (G.k + 1) + "/" + G.red.length : "");
  showOverlay('<h2>🌍 Geo</h2>' +
    '<div class="btns">' +
    (nast ? '<button id="nastBtn">▶ Nastavi kviz' + opis + '</button>' : '') +
    '<button id="samBtn">👤 Vežbanje</button>' +
    '<button id="sobaBtn">🌐 Napravi sobu</button>' +
    '<button id="udjiBtn">🔗 Uđi u sobu</button>' +
    '<button id="pravBtn">❔ Pravila</button></div>' +
    '<p>' + (nast
      ? (sacuvanaMreza ? "Prekinuti kviz se čuva — pritisnite „Nastavi kviz“ svi."
                       : "Prekinuti kviz te čeka dok sam ne kreneš iznova.")
      : "Deset pitanja iz geografije. Do četiri igrača: svi telefoni vide isto pitanje, a poene nosi onaj ko brže pogodi.") + '</p>');
  if (nast) $("#nastBtn").onclick = nastaviKviz;
  $("#samBtn").onclick = () => novaIgra("sam");
  $("#sobaBtn").onclick = () => napraviSobu();
  $("#udjiBtn").onclick = udjiUSobu;
  $("#pravBtn").onclick = pravila;
}
function pravila() {
  showOverlay('<h2>Pravila</h2>' +
    '<ul><li>Deset pitanja, na svako imaš <b>15 sekundi</b>.</li>' +
    '<li><b>Tačan odgovor +3</b>, a promašaj <b>−1</b> i to pitanje ti je zaključano.</li>' +
    '<li>U sobi može <b>do četiri igrača</b>. Broji se koliko ti je trebalo od trenutka kad se pitanje pojavilo — ' +
    'najbrži tačan dobija +3, ostali tačni +1. Kad neko pogodi, ostali imaju još oko dve sekunde.</li>' +
    '<li>Ponuđeni odgovori se mešaju, ali su isto poređani na svim telefonima.</li>' +
    '<li>Uz teža pitanja piše i kratko objašnjenje ℹ️.</li></ul>' +
    '<div class="btns"><button id="nazadBtn2">← Nazad</button></div>');
  $("#nazadBtn2").onclick = meni;
}
function nastaviKviz() {
  if (!sacuvanaMreza) {                        // vežbanje: samo nastavi tamo gde si stao
    if (!G || G.gotovo) return novaIgra("sam");
    hideOverlay(); zadnjiK = -1; mojIzbor = null;
    if (G.faza === "pitanje") pocniPitanje(); else dalje();
    return;
  }
  nastavljam = true;
  if (sacuvanaMreza.uloga === "domacin") { mojIndex = sacuvanaMreza.mojIndex || 0; napraviSobu(sacuvanaMreza.kod); }
  else { mojIndex = sacuvanaMreza.mojIndex || 1; pridruziSe(sacuvanaMreza.kod, true); }
}
function napraviSobu(istiKod) {
  if (!Mreza.podrzana()) { showOverlay('<h2>Nije podržano</h2><p>Ovaj pregledač ne ume vezu sa drugim telefonom.</p><div class="btns"><button id="nb2">← Nazad</button></div>'); $("#nb2").onclick = meni; return; }
  const kod = typeof istiKod === "string" ? istiKod : null;
  if (!kod) nastavljam = false;
  ponoviVezu = () => napraviSobu(kod);
  showOverlay('<h2>' + (kod ? "Otvaram staru sobu…" : "Pravim sobu…") + '</h2><p>Spajam se na server za upoznavanje igrača.</p>');
  Mreza.napravi({ kod: kod, poruka: primi, status: statusMreze }).catch(() => { });
}
function udjiUSobu() {
  showOverlay('<h2>Uđi u sobu</h2><p>Ukucaj kod koji ti je poslao domaćin.</p>' +
    '<input id="kodIn" maxlength="5" placeholder="KOD" autocapitalize="characters" autocomplete="off">' +
    '<div class="btns"><button id="idiBtn">🔗 Poveži se</button><button id="nazadBtn3">← Nazad</button></div>');
  $("#nazadBtn3").onclick = meni;
  $("#idiBtn").onclick = () => {
    const k = $("#kodIn").value.trim();
    if (k.length < 4) return;
    pridruziSe(k.toUpperCase(), false);
  };
  setTimeout(() => { const i = $("#kodIn"); if (i) i.focus(); }, 100);
}
function pridruziSe(k, nastavakStare) {
  nastavljam = !!nastavakStare;
  ponoviVezu = () => pridruziSe(k, nastavakStare);
  showOverlay('<h2>Spajam se…</h2><p>' + (nastavakStare ? "Vraćam se u sobu" : "Tražim sobu") +
    ' <b style="color:var(--gold)">' + k + '</b></p>');
  Mreza.pridruzi(k, { poruka: primi, status: statusMreze }).catch(() => { });
}
function showOverlay(h) { const o = $("#overlay"); o.innerHTML = h; o.hidden = false; }
function hideOverlay() { $("#overlay").hidden = true; }

$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("sudoku.theme", b.dataset.theme); } catch (e) { }
};

/* ---------- start ---------- */
try { const t = localStorage.getItem("sudoku.theme"); if (t) document.body.dataset.theme = t; } catch (e) { }
if (load()) { render(); meni(); } else { novaIgra("sam"); meni(); }

window.GEO = {
  get G() { return G; }, PIT, novaIgra, render, primi, statusMreze, raspored, izborPitanja,
  odgovori: p => odgovori_klik(p), meni, save, load, nastaviKviz,
  primiPostavu, kreniPartiju, imeIgraca, meniSobe, osveziPostavu, uSobi, sedim,
  get mojIndex() { return mojIndex; }, get mojIzbor() { return mojIzbor; },
  get postava() { return postava; },
  get sacuvanaMreza() { return sacuvanaMreza; },
  tacnaPozicija: () => tacnaPozicija()
};
</script>
</body>
</html>
